<script>

    // =========================================================
    // VARIABLES
    // =========================================================

    let jugadores = [];

    let partidos = [];

    let categorias = [];


    // =========================================================
    // OBTENER JWT
    // =========================================================

    function getJwt() {

        const cookie =
            document.cookie
                .split('; ')
                .find(row =>
                    row.startsWith('token=')
                );


        return cookie
            ? cookie.substring(6)
            : null;

    }


    // =========================================================
    // NORMALIZAR RESPUESTA
    // =========================================================

    function obtenerArray(data) {

        if (Array.isArray(data)) {

            return data;

        }


        if (
            data &&
            Array.isArray(data.content)
        ) {

            return data.content;

        }


        if (
            data &&
            typeof data === 'object'
        ) {

            return [data];

        }


        return [];

    }


    // =========================================================
    // OBTENER ID DE CATEGORÍA
    // =========================================================

    function obtenerCategoriaId(objeto) {

        if (!objeto) {

            return null;

        }


        if (
            objeto.categoriaId !== undefined &&
            objeto.categoriaId !== null
        ) {

            return Number(
                objeto.categoriaId
            );

        }


        if (
            objeto.categoria &&
            objeto.categoria.id !== undefined &&
            objeto.categoria.id !== null
        ) {

            return Number(
                objeto.categoria.id
            );

        }


        if (
            objeto.categoria &&
            objeto.categoria.categoriaId !== undefined &&
            objeto.categoria.categoriaId !== null
        ) {

            return Number(
                objeto.categoria.categoriaId
            );

        }


        if (
            objeto.categoria &&
            objeto.categoria.idCategoria !== undefined &&
            objeto.categoria.idCategoria !== null
        ) {

            return Number(
                objeto.categoria.idCategoria
            );

        }


        return null;

    }


    // =========================================================
    // CARGAR CATEGORÍAS
    // =========================================================

    async function cargarCategorias() {

        const select =
            document.getElementById(
                'categoriaId'
            );


        const token =
            getJwt();


        if (!token) {

            alert(
                "Sesión expirada."
            );


            window.location.href =
                "/login";


            return false;

        }


        try {

            const res =
                await fetch(
                    '/api/categorias',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar las categorías."
                    );

                }


                throw new Error(
                    "No se pudieron cargar las categorías."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/categorias:",
                data
            );


            categorias =
                obtenerArray(data);


            select.innerHTML = `

                <option value="">

                    Seleccione una categoría...

                </option>

            `;


            categorias.forEach(
                categoria => {

                    if (!categoria.id) {

                        return;

                    }


                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        categoria.id;


                    option.textContent =
                        categoria.nombre ||
                        categoria.descripcion ||
                        `Categoría #${categoria.id}`;


                    select.appendChild(
                        option
                    );

                }
            );


            if (
                categorias.length === 0
            ) {

                select.innerHTML = `

                    <option value="">

                        No hay categorías registradas

                    </option>

                `;

            }


            return true;


        } catch (error) {

            console.error(
                "Error cargando categorías:",
                error
            );


            select.innerHTML = `

                <option value="">

                    Error al cargar categorías

                </option>

            `;


            alert(
                error.message ||
                "No se pudieron cargar las categorías."
            );


            return false;

        }

    }


    // =========================================================
    // CARGAR JUGADORES
    // =========================================================

    async function cargarJugadores() {

        const token =
            getJwt();


        if (!token) {

            alert(
                "Sesión expirada."
            );


            window.location.href =
                "/login";


            return false;

        }


        try {

            const res =
                await fetch(
                    '/api/jugadores',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar los jugadores."
                    );

                }


                throw new Error(
                    "No se pudieron cargar los jugadores."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/jugadores:",
                data
            );


            jugadores =
                obtenerArray(data);


            return true;


        } catch (error) {

            console.error(
                "Error cargando jugadores:",
                error
            );


            alert(
                error.message ||
                "No se pudieron cargar los jugadores."
            );


            return false;

        }

    }


    // =========================================================
    // CARGAR PARTIDOS
    // =========================================================

    async function cargarPartidos() {

        const token =
            getJwt();


        if (!token) {

            alert(
                "Sesión expirada."
            );


            window.location.href =
                "/login";


            return false;

        }


        try {

            const res =
                await fetch(
                    '/api/partidos',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar los partidos."
                    );

                }


                throw new Error(
                    "No se pudieron cargar los partidos."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/partidos:",
                data
            );


            partidos =
                obtenerArray(data);


            return true;


        } catch (error) {

            console.error(
                "Error cargando partidos:",
                error
            );


            alert(
                error.message ||
                "No se pudieron cargar los partidos."
            );


            return false;

        }

    }


    // =========================================================
    // ACTUALIZAR JUGADORES SEGÚN CATEGORÍA
    // =========================================================

    function actualizarJugadores() {

        const select =
            document.getElementById(
                'jugadorId'
            );


        const categoriaId =
            Number(
                document.getElementById(
                    'categoriaId'
                ).value
            );


        select.innerHTML = `

            <option value="">

                Seleccione un jugador...

            </option>

        `;


        if (!categoriaId) {

            select.innerHTML = `

                <option value="">

                    Seleccioná una categoría primero...

                </option>

            `;


            select.disabled =
                true;


            return;

        }


        const jugadoresFiltrados =
            jugadores.filter(
                jugador =>
                    obtenerCategoriaId(jugador) ===
                    categoriaId
            );


        if (
            jugadoresFiltrados.length === 0
        ) {

            select.innerHTML = `

                <option value="">

                    No hay jugadores en esta categoría

                </option>

            `;


            select.disabled =
                true;


            return;

        }


        jugadoresFiltrados.forEach(
            jugador => {

                if (!jugador.id) {

                    return;

                }


                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    jugador.id;


                const nombre =
                    jugador.nombre ??
                    jugador.nombres ??
                    "";


                const apellido =
                    jugador.apellido ??
                    jugador.apellidos ??
                    "";


                option.textContent =
                    `${nombre} ${apellido}`.trim()
                    || `Jugador #${jugador.id}`;


                select.appendChild(
                    option
                );

            }
        );


        select.disabled =
            false;

    }


    // =========================================================
    // ACTUALIZAR PARTIDOS SEGÚN CATEGORÍA
    // =========================================================

    function actualizarPartidos() {

        const select =
            document.getElementById(
                'partidoId'
            );


        const categoriaId =
            Number(
                document.getElementById(
                    'categoriaId'
                ).value
            );


        select.innerHTML = `

            <option value="">

                Seleccione un partido...

            </option>

        `;


        if (!categoriaId) {

            select.innerHTML = `

                <option value="">

                    Seleccioná una categoría primero...

                </option>

            `;


            select.disabled =
                true;


            return;

        }


        const partidosFiltrados =
            partidos.filter(
                partido =>
                    obtenerCategoriaId(partido) ===
                    categoriaId
            );


        if (
            partidosFiltrados.length === 0
        ) {

            select.innerHTML = `

                <option value="">

                    No hay partidos en esta categoría

                </option>

            `;


            select.disabled =
                true;


            return;

        }


        partidosFiltrados.forEach(
            partido => {

                if (!partido.id) {

                    return;

                }


                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    partido.id;


                const condicion =
                    partido.local === true ||
                    partido.local === "true"
                        ? "Local"
                        : "Visitante";


                option.textContent =
                    `${partido.fecha || 'Sin fecha'} - `
                    + `${condicion} vs `
                    + `${partido.rival || 'Sin rival'}`;


                select.appendChild(
                    option
                );

            }
        );


        select.disabled =
            false;

    }


    // =========================================================
    // CAMBIO DE CATEGORÍA
    // =========================================================

    document.getElementById(
        'categoriaId'
    ).addEventListener(
        'change',
        function () {

            const categoriaId =
                this.value;


            const contenedor =
                document.getElementById(
                    'contenedorJugadorPartido'
                );


            const jugadorSelect =
                document.getElementById(
                    'jugadorId'
                );


            const partidoSelect =
                document.getElementById(
                    'partidoId'
                );


            if (!categoriaId) {

                contenedor.classList.add(
                    'hidden'
                );


                jugadorSelect.value =
                    "";


                partidoSelect.value =
                    "";


                jugadorSelect.disabled =
                    true;


                partidoSelect.disabled =
                    true;


                jugadorSelect.innerHTML = `

                    <option value="">

                        Seleccioná una categoría primero...

                    </option>

                `;


                partidoSelect.innerHTML = `

                    <option value="">

                        Seleccioná una categoría primero...

                    </option>

                `;


                return;

            }


            contenedor.classList.remove(
                'hidden'
            );


            actualizarJugadores();

            actualizarPartidos();

        }
    );


    // =========================================================
    // INICIALIZAR
    // =========================================================

    document.addEventListener(
        'DOMContentLoaded',
        async function () {

            const token =
                getJwt();


            if (!token) {

                alert(
                    "Sesión expirada."
                );


                window.location.href =
                    "/login";


                return;

            }


            await Promise.all([

                cargarCategorias(),

                cargarJugadores(),

                cargarPartidos()

            ]);

        }
    );


    // =========================================================
    // GUARDAR INCIDENCIA
    // =========================================================

    document.getElementById(
        'incidenciaForm'
    ).addEventListener(
        'submit',
        async function (e) {

            e.preventDefault();


            const token =
                getJwt();


            if (!token) {

                alert(
                    "Sesión expirada."
                );


                window.location.href =
                    "/login";


                return;

            }


            // =================================================
            // DATOS
            // =================================================

            const categoriaId =
                document.getElementById(
                    'categoriaId'
                ).value;


            const jugadorId =
                document.getElementById(
                    'jugadorId'
                ).value;


            const partidoId =
                document.getElementById(
                    'partidoId'
                ).value;


            const fecha =
                document.getElementById(
                    'fecha'
                ).value;


            const motivo =
                document.getElementById(
                    'motivo'
                ).value.trim();


            const cantidadDias =
                document.getElementById(
                    'cantidadDias'
                ).value;


            // =================================================
            // VALIDACIONES
            // =================================================

            if (!categoriaId) {

                alert(
                    "Debés seleccionar una categoría."
                );


                return;

            }


            if (!jugadorId) {

                alert(
                    "Debés seleccionar un jugador."
                );


                return;

            }


            if (!fecha) {

                alert(
                    "Debés seleccionar una fecha."
                );


                return;

            }


            if (!motivo) {

                alert(
                    "Debés ingresar el motivo de la incidencia."
                );


                return;

            }


            if (
                cantidadDias === "" ||
                Number(cantidadDias) < 0
            ) {

                alert(
                    "La cantidad de días no puede ser negativa."
                );


                return;

            }


            // =================================================
            // OBJETO
            // =================================================

            const incidenciaData = {

                jugadorId:
                    Number(jugadorId),

                partidoId:
                    partidoId
                        ? Number(partidoId)
                        : null,

                fecha:
                    fecha,

                motivo:
                    motivo,

                cantidadDias:
                    Number(cantidadDias)

            };


            console.log(
                "Categoría seleccionada:",
                categoriaId
            );


            console.log(
                "Enviando incidencia:",
                incidenciaData
            );


            // =================================================
            // BOTÓN
            // =================================================

            const boton =
                document.getElementById(
                    'submitButton'
                );


            boton.disabled =
                true;


            boton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';


            try {

                const res =
                    await fetch(
                        '/api/incidencias',
                        {

                            method: 'POST',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            },

                            body:
                                JSON.stringify(
                                    incidenciaData
                                )

                        }
                    );


                // =================================================
                // ERROR
                // =================================================

                if (!res.ok) {

                    let mensaje =
                        "No se pudo guardar la incidencia.";


                    try {

                        const errorData =
                            await res.json();


                        if (

                        ) {

                            mensaje =
                                errorData.mensaje;

                        } else if (
                            errorData.message
                        ) {

                            mensaje =
                                errorData.message;

                        }

                    } catch (_) {

                        const texto =
                            await res.text();


                        if (texto) {

                            console.error(
                                "Respuesta del servidor:",
                                texto
                            );

                        }

                    }


                    throw new Error(
                        mensaje
                    );

                }


                // =================================================
                // RESPUESTA
                // =================================================

                const savedIncidencia =
                    await res.json();


                console.log(
                    "Incidencia guardada:",
                    savedIncidencia
                );


                alert(
                    "Incidencia creada correctamente."
                );


                window.location.href =
                    "/incidencias";


            } catch (error) {

                console.error(
                    "Error guardando incidencia:",
                    error
                );


                alert(
                    error.message ||
                    "Error al guardar la incidencia."
                );


                boton.disabled =
                    false;


                boton.innerHTML =
                    '<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar incidencia';

            }

        }
    );

</script>
