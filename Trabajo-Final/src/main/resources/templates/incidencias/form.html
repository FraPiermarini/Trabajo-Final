<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(~{::#content})}"
      lang="es">

<head>

    <meta charset="UTF-8">

    <title>Nueva Incidencia</title>

    <link rel="icon" href="data:,">

</head>

<body>

<div id="content" class="max-w-[1200px] mx-auto w-full">


    <div class="flex items-center gap-3 sm:gap-4 mb-6 sm:mb-10">

        <a th:href="@{/incidencias}"
           class="w-10 h-10 sm:w-11 sm:h-11 shrink-0 flex items-center justify-center
                  bg-[#0f172a] border border-slate-800 rounded-xl
                  text-slate-400 hover:text-emerald-500
                  hover:border-emerald-500/30 transition-all">

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <div class="min-w-0">

            <h1 class="text-2xl sm:text-3xl md:text-4xl font-black text-white
                       tracking-tight italic uppercase break-words">

                Nueva Incidencia

            </h1>


            <p class="text-emerald-500 font-bold mt-1 text-sm sm:text-base break-words">

                Registrá una incidencia de un jugador.

            </p>

        </div>

    </div>


    <form id="incidenciaForm"
          class="space-y-6 sm:space-y-8">


        <div class="bg-[#0f172a]
                    border border-slate-800
                    rounded-2xl sm:rounded-[2.5rem]
                    p-5 sm:p-8">

            <div class="flex items-center gap-3 mb-6 sm:mb-8">

                <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl
                            bg-emerald-500/10
                            flex items-center
                            justify-center
                            text-emerald-500">

                    <i class="fa-solid fa-layer-group"></i>

                </div>


                <div class="min-w-0">

                    <h3 class="font-black text-white
                               uppercase italic text-sm sm:text-base">

                        Categoría

                    </h3>


                    <p class="text-[10px]
                              text-slate-600
                              font-bold
                              uppercase
                              tracking-widest
                              break-words">

                        Seleccioná primero la categoría

                    </p>

                </div>

            </div>


            <div>

                <label for="categoriaId"
                       class="block text-[10px]
                              font-black text-slate-500
                              uppercase tracking-widest mb-2">

                    Categoría

                </label>


                <select id="categoriaId"
                        required
                        class="w-full min-w-0
                               bg-[#0a0f1d]
                               border border-slate-800
                               text-slate-200
                               px-4 py-3
                               rounded-xl
                               outline-none
                               focus:ring-2
                               focus:ring-emerald-500
                               focus:border-transparent
                               transition-all">

                    <option value="">

                        Cargando categorías...

                    </option>

                </select>

            </div>

        </div>


        <div id="contenedorJugadorPartido"
             class="bg-[#0f172a]
                    border border-slate-800
                    rounded-2xl sm:rounded-[2.5rem]
                    p-5 sm:p-8 hidden">


            <div class="flex items-center gap-3 mb-6 sm:mb-8">

                <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl
                            bg-emerald-500/10
                            flex items-center
                            justify-center
                            text-emerald-500">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                </div>


                <div class="min-w-0">

                    <h3 class="font-black text-white
                               uppercase italic text-sm sm:text-base">

                        Jugador y partido

                    </h3>


                    <p class="text-[10px]
                              text-slate-600
                              font-bold
                              uppercase
                              tracking-widest
                              break-words">

                        Seleccioná el jugador, campeonato y partido relacionado

                    </p>

                </div>

            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">


                <div class="min-w-0">

                    <label for="jugadorId"
                           class="block text-[10px]
                                  font-black text-slate-500
                                  uppercase tracking-widest mb-2">

                        Jugador

                    </label>


                    <select id="jugadorId"
                            required
                            disabled
                            class="w-full min-w-0
                                   bg-[#0a0f1d]
                                   border border-slate-800
                                   text-slate-200
                                   px-4 py-3
                                   rounded-xl
                                   outline-none
                                   focus:ring-2
                                   focus:ring-emerald-500
                                   focus:border-transparent
                                   transition-all
                                   disabled:opacity-50
                                   disabled:cursor-not-allowed">

                        <option value="">

                            Seleccioná una categoría primero...

                        </option>

                    </select>

                </div>


                <div class="min-w-0">

                    <label for="campeonatoId"
                           class="block text-[10px]
                                  font-black text-slate-500
                                  uppercase tracking-widest mb-2">

                        Campeonato

                    </label>


                    <select id="campeonatoId"
                            disabled
                            class="w-full min-w-0
                                   bg-[#0a0f1d]
                                   border border-slate-800
                                   text-slate-200
                                   px-4 py-3
                                   rounded-xl
                                   outline-none
                                   focus:ring-2
                                   focus:ring-emerald-500
                                   focus:border-transparent
                                   transition-all
                                   disabled:opacity-50
                                   disabled:cursor-not-allowed">

                        <option value="">

                            Seleccioná una categoría primero...

                        </option>

                    </select>

                </div>


                <div class="md:col-span-2 min-w-0">

                    <label for="partidoId"
                           class="block text-[10px]
                                  font-black text-slate-500
                                  uppercase tracking-widest mb-2">

                        Partido

                    </label>


                    <select id="partidoId"
                            disabled
                            class="w-full min-w-0
                                   bg-[#0a0f1d]
                                   border border-slate-800
                                   text-slate-200
                                   px-4 py-3
                                   rounded-xl
                                   outline-none
                                   focus:ring-2
                                   focus:ring-emerald-500
                                   focus:border-transparent
                                   transition-all
                                   disabled:opacity-50
                                   disabled:cursor-not-allowed">

                        <option value="">

                            Seleccioná primero un campeonato...

                        </option>

                    </select>


                    <p class="text-[10px]
                              text-slate-600
                              font-bold
                              mt-2
                              break-words">
                    </p>

                </div>

            </div>

        </div>


        <div class="bg-[#0f172a]
                    border border-slate-800
                    rounded-2xl sm:rounded-[2.5rem]
                    p-5 sm:p-8">


            <div class="flex items-center gap-3 mb-6 sm:mb-8">

                <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl
                            bg-emerald-500/10
                            flex items-center
                            justify-center
                            text-emerald-500">

                    <i class="fa-solid fa-file-circle-exclamation"></i>

                </div>


                <div class="min-w-0">

                    <h3 class="font-black text-white
                               uppercase italic text-sm sm:text-base">

                        Datos de la incidencia

                    </h3>


                    <p class="text-[10px]
                              text-slate-600
                              font-bold
                              uppercase
                              tracking-widest
                              break-words">

                        Información de la incidencia registrada

                    </p>

                </div>

            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">


                <div class="min-w-0">

                    <label for="fecha"
                           class="block text-[10px]
                                  font-black text-slate-500
                                  uppercase tracking-widest mb-2">

                        Fecha

                    </label>


                    <input type="date"
                           id="fecha"
                           required
                           class="w-full min-w-0
                                  bg-[#0a0f1d]
                                  border border-slate-800
                                  text-slate-200
                                  px-4 py-3
                                  rounded-xl
                                  outline-none
                                  focus:ring-2
                                  focus:ring-emerald-500
                                  focus:border-transparent
                                  transition-all">

                </div>


                <div class="min-w-0">

                    <label for="cantidadDias"
                           class="block text-[10px]
                                  font-black text-slate-500
                                  uppercase tracking-widest mb-2">

                        Cantidad de días

                    </label>


                    <input type="number"
                           id="cantidadDias"
                           min="0"
                           value="0"
                           required
                           class="w-full min-w-0
                                  bg-[#0a0f1d]
                                  border border-slate-800
                                  text-slate-200
                                  px-4 py-3
                                  rounded-xl
                                  outline-none
                                  focus:ring-2
                                  focus:ring-emerald-500
                                  focus:border-transparent
                                  transition-all">

                </div>


                <div class="md:col-span-2 min-w-0">

                    <label for="motivo"
                           class="block text-[10px]
                                  font-black text-slate-500
                                  uppercase tracking-widest mb-2">

                        Motivo

                    </label>


                    <textarea id="motivo"
                              rows="4"
                              required
                              placeholder="Ej: Lesión muscular, suspensión, enfermedad..."
                              class="w-full min-w-0
                                     bg-[#0a0f1d]
                                     border border-slate-800
                                     text-slate-200
                                     placeholder-slate-600
                                     px-4 py-3
                                     rounded-xl
                                     outline-none
                                     resize-none
                                     focus:ring-2
                                     focus:ring-emerald-500
                                     focus:border-transparent
                                     transition-all"></textarea>

                </div>

            </div>

        </div>


        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3">

            <a th:href="@{/incidencias}"
               class="w-full sm:w-auto justify-center
                      px-6 py-3 rounded-xl
                      border border-slate-800
                      bg-[#0f172a]
                      text-slate-400
                      hover:text-white
                      hover:border-slate-700
                      font-bold
                      transition-all
                      flex items-center">

                Cancelar

            </a>


            <button type="submit"
                    id="submitButton"
                    class="w-full sm:w-auto justify-center
                           px-8 py-3 rounded-xl
                           bg-emerald-500
                           hover:bg-emerald-400
                           text-slate-900
                           font-black
                           uppercase
                           text-xs
                           tracking-widest
                           shadow-lg
                           shadow-emerald-500/20
                           transition-all
                           flex items-center">

                <i class="fa-solid fa-floppy-disk mr-2"></i>

                Guardar incidencia

            </button>

        </div>

    </form>


    <script>


        let jugadores = [];

        let partidos = [];

        let categorias = [];

        let campeonatos = [];


        function getJwt() {

            const cookie =
                document.cookie
                    .split('; ')
                    .find(row =>
                        row.startsWith('token=')
                    );


            return cookie
                ? cookie.substring(6)
                : null;

        }


        function obtenerArray(data) {

            if (Array.isArray(data)) {

                return data;

            }


            if (
                data &&
                Array.isArray(data.content)
            ) {

                return data.content;

            }


            if (
                data &&
                typeof data === 'object'
            ) {

                return [data];

            }


            return [];

        }



        function obtenerCategoriaId(objeto) {

            if (!objeto) {

                return null;

            }


            if (
                objeto.categoriaId !== undefined &&
                objeto.categoriaId !== null
            ) {

                return Number(
                    objeto.categoriaId
                );

            }


            if (
                objeto.categoria &&
                objeto.categoria.id !== undefined &&
                objeto.categoria.id !== null
            ) {

                return Number(
                    objeto.categoria.id
                );

            }


            if (
                objeto.categoria &&
                objeto.categoria.categoriaId !== undefined &&
                objeto.categoria.categoriaId !== null
            ) {

                return Number(
                    objeto.categoria.categoriaId
                );

            }


            if (
                objeto.categoria &&
                objeto.categoria.idCategoria !== undefined &&
                objeto.categoria.idCategoria !== null
            ) {

                return Number(
                    objeto.categoria.idCategoria
                );

            }


            return null;

        }


        function obtenerCampeonatoId(objeto) {

            if (!objeto) {

                return null;

            }


            if (
                objeto.campeonatoId !== undefined &&
                objeto.campeonatoId !== null
            ) {

                return Number(
                    objeto.campeonatoId
                );

            }


            if (
                objeto.campeonato &&
                objeto.campeonato.id !== undefined &&
                objeto.campeonato.id !== null
            ) {

                return Number(
                    objeto.campeonato.id
                );

            }


            if (
                objeto.campeonato &&
                objeto.campeonato.campeonatoId !== undefined &&
                objeto.campeonato.campeonatoId !== null
            ) {

                return Number(
                    objeto.campeonato.campeonatoId
                );

            }


            if (
                objeto.campeonato &&
                objeto.campeonato.idCampeonato !== undefined &&
                objeto.campeonato.idCampeonato !== null
            ) {

                return Number(
                    objeto.campeonato.idCampeonato
                );

            }


            return null;

        }


        async function cargarCategorias() {

            const select =
                document.getElementById(
                    'categoriaId'
                );


            const token =
                getJwt();


            if (!token) {

                alert(
                    "Sesión expirada."
                );


                window.location.href =
                    "/login";


                return false;

            }


            try {

                const res =
                    await fetch(
                        '/api/categorias',
                        {

                            method: 'GET',

                            headers: {

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            }

                        }
                    );


                if (!res.ok) {

                    if (
                        res.status === 401 ||
                        res.status === 403
                    ) {

                        throw new Error(
                            "No tenés permisos para consultar las categorías."
                        );

                    }


                    throw new Error(
                        "No se pudieron cargar las categorías."
                    );

                }


                const data =
                    await res.json();


                console.log(
                    "Respuesta /api/categorias:",
                    data
                );


                categorias =
                    obtenerArray(data);


                select.innerHTML = `

                    <option value="">

                        Seleccione una categoría...

                    </option>

                `;


                categorias.forEach(
                    categoria => {

                        if (!categoria.id) {

                            return;

                        }


                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            categoria.id;


                        option.textContent =
                            categoria.nombre ||
                            categoria.descripcion ||
                            `Categoría #${categoria.id}`;


                        select.appendChild(
                            option
                        );

                    }
                );


                if (
                    categorias.length === 0
                ) {

                    select.innerHTML = `

                        <option value="">

                            No hay categorías registradas

                        </option>

                    `;

                }


                return true;


            } catch (error) {

                console.error(
                    "Error cargando categorías:",
                    error
                );


                select.innerHTML = `

                    <option value="">

                        Error al cargar categorías

                    </option>

                `;


                alert(
                    error.message ||
                    "No se pudieron cargar las categorías."
                );


                return false;

            }

        }


        async function cargarJugadores() {

            const token =
                getJwt();


            if (!token) {

                alert(
                    "Sesión expirada."
                );


                window.location.href =
                    "/login";


                return false;

            }


            try {

                const res =
                    await fetch(
                        '/api/jugadores',
                        {

                            method: 'GET',

                            headers: {

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            }

                        }
                    );


                if (!res.ok) {

                    if (
                        res.status === 401 ||
                        res.status === 403
                    ) {

                        throw new Error(
                            "No tenés permisos para consultar los jugadores."
                        );

                    }


                    throw new Error(
                        "No se pudieron cargar los jugadores."
                    );

                }


                const data =
                    await res.json();


                console.log(
                    "Respuesta /api/jugadores:",
                    data
                );


                jugadores =
                    obtenerArray(data);


                return true;


            } catch (error) {

                console.error(
                    "Error cargando jugadores:",
                    error
                );


                alert(
                    error.message ||
                    "No se pudieron cargar los jugadores."
                );


                return false;

            }

        }


        async function cargarPartidos() {

            const token =
                getJwt();


            if (!token) {

                alert(
                    "Sesión expirada."
                );


                window.location.href =
                    "/login";


                return false;

            }


            try {

                const res =
                    await fetch(
                        '/api/partidos',
                        {

                            method: 'GET',

                            headers: {

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            }

                        }
                    );


                if (!res.ok) {

                    if (
                        res.status === 401 ||
                        res.status === 403
                    ) {

                        throw new Error(
                            "No tenés permisos para consultar los partidos."
                        );

                    }


                    throw new Error(
                        "No se pudieron cargar los partidos."
                    );

                }


                const data =
                    await res.json();


                console.log(
                    "Respuesta /api/partidos:",
                    data
                );


                partidos =
                    obtenerArray(data);


                return true;


            } catch (error) {

                console.error(
                    "Error cargando partidos:",
                    error
                );


                alert(
                    error.message ||
                    "No se pudieron cargar los partidos."
                );


                return false;

            }

        }


        async function cargarCampeonatos() {

            const token =
                getJwt();


            const select =
                document.getElementById(
                    'campeonatoId'
                );


            if (!token) {

                alert(
                    "Sesión expirada."
                );


                window.location.href =
                    "/login";


                return false;

            }


            try {

                const res =
                    await fetch(
                        '/api/campeonatos',
                        {

                            method: 'GET',

                            headers: {

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            }

                        }
                    );


                if (!res.ok) {

                    if (
                        res.status === 401 ||
                        res.status === 403
                    ) {

                        throw new Error(
                            "No tenés permisos para consultar los campeonatos."
                        );

                    }


                    throw new Error(
                        "No se pudieron cargar los campeonatos."
                    );

                }


                const data =
                    await res.json();


                console.log(
                    "Respuesta /api/campeonatos:",
                    data
                );


                campeonatos =
                    obtenerArray(data);


                select.innerHTML = `

                    <option value="">

                        Seleccione un campeonato...

                    </option>

                `;


                campeonatos.forEach(
                    campeonato => {

                        if (!campeonato.id) {

                            return;

                        }


                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            campeonato.id;


                        option.textContent =
                            campeonato.nombre ||
                            campeonato.descripcion ||
                            `Campeonato #${campeonato.id}`;


                        select.appendChild(
                            option
                        );

                    }
                );


                if (
                    campeonatos.length === 0
                ) {

                    select.innerHTML = `

                        <option value="">

                            No hay campeonatos registrados

                        </option>

                    `;

                }


                return true;


            } catch (error) {

                console.error(
                    "Error cargando campeonatos:",
                    error
                );


                select.innerHTML = `

                    <option value="">

                        Error al cargar campeonatos

                    </option>

                `;


                alert(
                    error.message ||
                    "No se pudieron cargar los campeonatos."
                );


                return false;

            }

        }


        function actualizarJugadores() {

            const select =
                document.getElementById(
                    'jugadorId'
                );


            const categoriaId =
                Number(
                    document.getElementById(
                        'categoriaId'
                    ).value
                );


            select.innerHTML = `

                <option value="">

                    Seleccione un jugador...

                </option>

            `;


            if (!categoriaId) {

                select.innerHTML = `

                    <option value="">

                        Seleccioná una categoría primero...

                    </option>

                `;


                select.disabled =
                    true;


                return;

            }


            const jugadoresFiltrados =
                jugadores.filter(
                    jugador =>
                        obtenerCategoriaId(jugador) ===
                        categoriaId
                );


            if (
                jugadoresFiltrados.length === 0
            ) {

                select.innerHTML = `

                    <option value="">

                        No hay jugadores en esta categoría

                    </option>

                `;


                select.disabled =
                    true;


                return;

            }


            jugadoresFiltrados.forEach(
                jugador => {

                    if (!jugador.id) {

                        return;

                    }


                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        jugador.id;


                    const nombre =
                        jugador.nombre ??
                        jugador.nombres ??
                        "";


                    const apellido =
                        jugador.apellido ??
                        jugador.apellidos ??
                        "";


                    option.textContent =
                        `${nombre} ${apellido}`.trim()
                        || `Jugador #${jugador.id}`;


                    select.appendChild(
                        option
                    );

                }
            );


            select.disabled =
                false;

        }


        function actualizarPartidos() {

            const select =
                document.getElementById(
                    'partidoId'
                );


            const categoriaId =
                Number(
                    document.getElementById(
                        'categoriaId'
                    ).value
                );


            const campeonatoId =
                Number(
                    document.getElementById(
                        'campeonatoId'
                    ).value
                );


            select.innerHTML = `

                <option value="">

                    Seleccione un partido...

                </option>

            `;


            if (!categoriaId) {

                select.innerHTML = `

                    <option value="">

                        Seleccioná una categoría primero...

                    </option>

                `;


                select.disabled =
                    true;


                return;

            }


            if (!campeonatoId) {

                select.innerHTML = `

                    <option value="">

                        Seleccioná un campeonato primero...

                    </option>

                `;


                select.disabled =
                    true;


                return;

            }


            const partidosFiltrados =
                partidos.filter(
                    partido =>
                        obtenerCategoriaId(partido) ===
                        categoriaId
                        &&
                        obtenerCampeonatoId(partido) ===
                        campeonatoId
                );


            if (
                partidosFiltrados.length === 0
            ) {

                select.innerHTML = `

                    <option value="">

                        No hay partidos para este campeonato

                    </option>

                `;


                select.disabled =
                    true;


                return;

            }


            partidosFiltrados.forEach(
                partido => {

                    if (!partido.id) {

                        return;

                    }


                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        partido.id;


                    const condicion =
                        partido.local === true ||
                        partido.local === "true"
                            ? "Local"
                            : "Visitante";


                    option.textContent =
                        `${partido.fecha || 'Sin fecha'} - `
                        + `${condicion} vs `
                        + `${partido.rival || 'Sin rival'}`;


                    select.appendChild(
                        option
                    );

                }
            );


            select.disabled =
                false;

        }


        document.getElementById(
            'categoriaId'
        ).addEventListener(
            'change',
            function () {

                const categoriaId =
                    this.value;


                const contenedor =
                    document.getElementById(
                        'contenedorJugadorPartido'
                    );


                const jugadorSelect =
                    document.getElementById(
                        'jugadorId'
                    );


                const campeonatoSelect =
                    document.getElementById(
                        'campeonatoId'
                    );


                const partidoSelect =
                    document.getElementById(
                        'partidoId'
                    );


                if (!categoriaId) {

                    contenedor.classList.add(
                        'hidden'
                    );


                    jugadorSelect.value =
                        "";


                    campeonatoSelect.value =
                        "";


                    partidoSelect.value =
                        "";


                    jugadorSelect.disabled =
                        true;


                    campeonatoSelect.disabled =
                        true;


                    partidoSelect.disabled =
                        true;


                    jugadorSelect.innerHTML = `

                        <option value="">

                            Seleccioná una categoría primero...

                        </option>

                    `;


                    campeonatoSelect.innerHTML = `

                        <option value="">

                            Seleccioná una categoría primero...

                        </option>

                    `;


                    partidoSelect.innerHTML = `

                        <option value="">

                            Seleccioná primero un campeonato...

                        </option>

                    `;


                    return;

                }


                contenedor.classList.remove(
                    'hidden'
                );


                actualizarJugadores();


                campeonatoSelect.disabled =
                    false;


                campeonatoSelect.value =
                    "";


                campeonatoSelect.innerHTML = `

                    <option value="">

                        Seleccione un campeonato...

                    </option>

                `;


                campeonatos.forEach(
                    campeonato => {

                        if (!campeonato.id) {

                            return;

                        }


                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            campeonato.id;


                        option.textContent =
                            campeonato.nombre ||
                            campeonato.descripcion ||
                            `Campeonato #${campeonato.id}`;


                        campeonatoSelect.appendChild(
                            option
                        );

                    }
                );


                partidoSelect.value =
                    "";


                partidoSelect.disabled =
                    true;


                partidoSelect.innerHTML = `

                    <option value="">

                        Seleccioná primero un campeonato...

                    </option>

                `;

            }
        );



        document.getElementById(
            'campeonatoId'
        ).addEventListener(
            'change',
            function () {

                const campeonatoId =
                    this.value;


                const partidoSelect =
                    document.getElementById(
                        'partidoId'
                    );


                partidoSelect.value =
                    "";


                if (!campeonatoId) {

                    partidoSelect.innerHTML = `

                        <option value="">

                            Seleccioná primero un campeonato...

                        </option>

                    `;


                    partidoSelect.disabled =
                        true;


                    return;

                }


                actualizarPartidos();

            }
        );


        document.addEventListener(
            'DOMContentLoaded',
            async function () {

                const token =
                    getJwt();


                if (!token) {

                    alert(
                        "Sesión expirada."
                    );


                    window.location.href =
                        "/login";


                    return;

                }


                await Promise.all([

                    cargarCategorias(),

                    cargarJugadores(),

                    cargarPartidos(),

                    cargarCampeonatos()

                ]);

            }
        );


        document.getElementById(
            'incidenciaForm'
        ).addEventListener(
            'submit',
            async function (e) {

                e.preventDefault();


                const token =
                    getJwt();


                if (!token) {

                    alert(
                        "Sesión expirada."
                    );


                    window.location.href =
                        "/login";


                    return;

                }



                const categoriaId =
                    document.getElementById(
                        'categoriaId'
                    ).value;


                const jugadorId =
                    document.getElementById(
                        'jugadorId'
                    ).value;


                const campeonatoId =
                    document.getElementById(
                        'campeonatoId'
                    ).value;


                const partidoId =
                    document.getElementById(
                        'partidoId'
                    ).value;


                const fecha =
                    document.getElementById(
                        'fecha'
                    ).value;


                const motivo =
                    document.getElementById(
                        'motivo'
                    ).value.trim();


                const cantidadDias =
                    document.getElementById(
                        'cantidadDias'
                    ).value;



                if (!categoriaId) {

                    alert(
                        "Debés seleccionar una categoría."
                    );


                    return;

                }


                if (!jugadorId) {

                    alert(
                        "Debés seleccionar un jugador."
                    );


                    return;

                }


                if (!campeonatoId) {

                    alert(
                        "Debés seleccionar un campeonato."
                    );


                    return;

                }


                if (!partidoId) {

                    alert(
                        "Debés seleccionar un partido."
                    );


                    return;

                }


                if (!fecha) {

                    alert(
                        "Debés seleccionar una fecha."
                    );


                    return;

                }


                if (!motivo) {

                    alert(
                        "Debés ingresar el motivo de la incidencia."
                    );


                    return;

                }


                if (
                    cantidadDias === "" ||
                    Number(cantidadDias) < 0
                ) {

                    alert(
                        "La cantidad de días no puede ser negativa."
                    );


                    return;

                }



                const incidenciaData = {

                    jugadorId:
                        Number(jugadorId),

                    partidoId:
                        Number(partidoId),

                    fecha:
                        fecha,

                    motivo:
                        motivo,

                    cantidadDias:
                        Number(cantidadDias)

                };


                console.log(
                    "Categoría seleccionada:",
                    categoriaId
                );


                console.log(
                    "Campeonato seleccionado:",
                    campeonatoId
                );


                console.log(
                    "Enviando incidencia:",
                    incidenciaData
                );



                const boton =
                    document.getElementById(
                        'submitButton'
                    );


                boton.disabled =
                    true;


                boton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';


                try {

                    const res =
                        await fetch(
                            '/api/incidencias',
                            {

                                method: 'POST',

                                headers: {

                                    'Content-Type':
                                        'application/json',

                                    'Authorization':
                                        'Bearer ' + token,

                                    'Accept':
                                        'application/json'

                                },

                                body:
                                    JSON.stringify(
                                        incidenciaData
                                    )

                            }
                        );


                    if (!res.ok) {

                        let mensaje =
                            "No se pudo guardar la incidencia.";


                        try {

                            const errorData =
                                await res.json();


                            if (
                                errorData.mensaje
                            ) {

                                mensaje =
                                    errorData.mensaje;

                            } else if (
                                errorData.message
                            ) {

                                mensaje =
                                    errorData.message;

                            }

                        } catch (_) {

                            const texto =
                                await res.text();


                            if (texto) {

                                console.error(
                                    "Respuesta del servidor:",
                                    texto
                                );

                            }

                        }


                        throw new Error(
                            mensaje
                        );

                    }


                    const savedIncidencia =
                        await res.json();


                    console.log(
                        "Incidencia guardada:",
                        savedIncidencia
                    );


                    alert(
                        "Incidencia creada correctamente."
                    );


                    window.location.href =
                        "/incidencias";


                } catch (error) {

                    console.error(
                        "Error guardando incidencia:",
                        error
                    );


                    alert(
                        error.message ||
                        "Error al guardar la incidencia."
                    );


                    boton.disabled =
                        false;


                    boton.innerHTML =
                        '<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar incidencia';

                }

            }
        );

    </script>

</div>

</body>

</html>
