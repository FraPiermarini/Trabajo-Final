<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Gestión Deportiva</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6
             bg-[url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2000&auto=format&fit=crop')]
             bg-cover bg-center bg-blend-overlay">

    <div class="bg-white/95 backdrop-blur-sm p-10 rounded-3xl shadow-2xl
                w-full max-w-md border border-white/20">

        <!-- LOGO -->
        <div class="flex justify-center mb-6">

            <div class="bg-blue-50 p-4 rounded-2xl">

                <span class="material-symbols-rounded text-blue-600 text-5xl">
                    sports_soccer
                </span>

            </div>

        </div>


        <!-- TITULO -->
        <h1 class="text-3xl font-extrabold text-slate-900 text-center mb-2">
            Gestión Deportiva
        </h1>

        <p class="text-slate-500 text-center mb-8">
            Iniciá sesión para acceder al sistema del club.
        </p>


        <!-- ERROR -->
        <div th:if="${param.error}"
             class="mb-6 p-4 bg-red-50 border-l-4 border-red-500
                    rounded-r-xl flex items-center gap-3 text-red-700">

            <span class="material-symbols-rounded">
                error
            </span>

            <p class="text-sm font-medium">
                Correo o contraseña incorrectos.
            </p>

        </div>


        <!-- LOGOUT -->
        <div th:if="${param.logout}"
             class="mb-6 p-4 bg-green-50 border-l-4 border-green-500
                    rounded-r-xl flex items-center gap-3 text-green-700">

            <span class="material-symbols-rounded">
                check_circle
            </span>

            <p class="text-sm font-medium">
                Sesión cerrada correctamente.
            </p>

        </div>


        <!-- LOGIN -->
        <form th:action="@{/login}"
              method="post"
              class="space-y-6">


            <!-- EMAIL -->
            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Correo electrónico
                </label>

                <div class="relative">

                    <span class="material-symbols-rounded absolute left-4 top-1/2
                                 -translate-y-1/2 text-slate-400">
                        mail
                    </span>

                    <input
                        type="email"
                        name="username"
                        required
                        autocomplete="email"
                        class="w-full pl-12 pr-4 py-3.5
                               bg-slate-50 border border-slate-200
                               rounded-2xl
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500
                               transition-all outline-none"
                        placeholder="correo@club.com">

                </div>

            </div>


            <!-- PASSWORD -->
            <div>

                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Contraseña
                </label>

                <div class="relative">

                    <span class="material-symbols-rounded absolute left-4 top-1/2
                                 -translate-y-1/2 text-slate-400">
                        lock
                    </span>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="w-full pl-12 pr-12 py-3.5
                               bg-slate-50 border border-slate-200
                               rounded-2xl
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500
                               transition-all outline-none"
                        placeholder="••••••••">


                    <button
                        type="button"
                        onclick="mostrarPassword()"
                        class="absolute right-4 top-1/2
                               -translate-y-1/2
                               text-slate-400
                               hover:text-slate-600">

                        <span id="iconPassword"
                              class="material-symbols-rounded">
                            visibility
                        </span>

                    </button>

                </div>

            </div>


            <!-- RECORDAR -->
            <div class="flex items-center">

                <input
                    type="checkbox"
                    id="remember"
                    name="remember-me"
                    class="w-5 h-5 rounded border-slate-300
                           text-blue-600 focus:ring-blue-500">

                <label
                    for="remember"
                    class="ml-3 text-sm font-medium text-slate-600">

                    Mantener sesión iniciada

                </label>

            </div>


            <!-- BOTON -->
            <button
                type="submit"
                class="w-full bg-blue-600
                       hover:bg-blue-700
                       text-white font-bold
                       py-4 rounded-2xl
                       shadow-lg shadow-blue-200
                       transition-all
                       active:scale-[0.98]">

                INICIAR SESIÓN

            </button>

        </form>


        <!-- REGISTRO -->
        <div class="mt-8 pt-7 border-t border-slate-100 text-center">

            <p class="text-slate-500 font-medium">
                ¿Todavía no tenés una cuenta?
            </p>

            <a
                th:href="@{/registro}"
                class="inline-flex items-center justify-center gap-2
                       mt-3 text-blue-600 font-bold
                       hover:text-blue-700 hover:underline">

                <span class="material-symbols-rounded text-xl">
                    person_add
                </span>

                Crear una cuenta

            </a>

        </div>

    </div>


    <!-- FOOTER -->
    <div class="fixed bottom-6 text-white/70 text-sm font-medium
                flex items-center gap-2">

        <span class="material-symbols-rounded text-base">
            shield
        </span>

        Acceso seguro al sistema

    </div>


    <script>

        function mostrarPassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("iconPassword");


            if (password.type === "password") {

                password.type = "text";
                icon.textContent = "visibility_off";

            } else {

                password.type = "password";
                icon.textContent = "visibility";

            }

        }

    </script>

</body>

</html>
