<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Club Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-2xl shadow-2xl flex max-w-4xl w-full m-4 overflow-hidden">
        <div class="hidden md:block w-1/2 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80');"></div>
        <div class="w-full md:w-1/2 p-10">
            <h1 class="text-2xl font-bold mb-6 text-slate-800 text-center">Acceso al Sistema</h1>
            <div id="error" class="hidden p-3 mb-4 bg-red-100 text-red-700 rounded-lg text-sm"></div>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" placeholder="Email" required class="w-full p-3 border rounded-lg outline-blue-500">
                <input type="password" id="password" placeholder="Contraseña" required class="w-full p-3 border rounded-lg outline-blue-500">
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Entrar</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-500">¿No tienes cuenta? <a th:href="@{/register}" class="text-blue-600 font-bold hover:underline">Regístrate</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
            });
            if(res.ok) {
                const data = await res.json();
                document.cookie = `token=${data.token}; path=/; max-age=86400; SameSite=Strict`;
                window.location.replace('/dashboard');
            } else {
                const errDiv = document.getElementById('error');
                errDiv.innerText = "Credenciales incorrectas";
                errDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
