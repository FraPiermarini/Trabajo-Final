<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Login - Gestión Deportiva</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <style>

        body {
            background: #f1f3f5;
        }

        .login-card {
            border-radius: 15px;
            border: none;
        }

        .btn-primary {
            border-radius: 10px;
        }

        input {
            border-radius: 10px !important;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="row vh-100 justify-content-center align-items-center">


        <div class="col-md-4">


            <div class="card shadow login-card">


                <div class="card-body p-4">


                    <h2 class="text-center mb-2">
                        ⚽ Gestión Deportiva
                    </h2>


                    <p class="text-center text-muted">
                        Iniciar sesión
                    </p>



                    <form id="loginForm">


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input 
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="correo@ejemplo.com"
                                required>

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input 
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="********"
                                required>

                        </div>



                        <button 
                            type="submit"
                            class="btn btn-primary w-100">

                            Ingresar

                        </button>


                    </form>



                    <div id="mensaje" 
                         class="text-center mt-3 text-danger">
                    </div>



                    <hr>


                    <div class="text-center">

                        <span>
                            ¿No tenés cuenta?
                        </span>

                        <a th:href="@{/registro}">
                            Registrate
                        </a>

                    </div>



                </div>


            </div>


        </div>


    </div>


</div>




<script>


document
.getElementById("loginForm")
.addEventListener("submit", async function(e){


    e.preventDefault();



    const datos = {


        email: document
                .getElementById("email")
                .value,


        password: document
                .getElementById("password")
                .value


    };



    try {


        const respuesta = await fetch("http://localhost:8083/api/auth/login", {


            method:"POST",


            headers:{


                "Content-Type":"application/json"


            },


            body: JSON.stringify(datos)


        });



        const data = await respuesta.json();



        console.log("Respuesta login:", data);



        if(respuesta.ok){



            localStorage.setItem(
                "token",
                data.token
            );


            localStorage.setItem(
                "rol",
                data.rol
            );


            localStorage.setItem(
                "nombre",
                data.nombre
            );



            window.location.href = "/";



        }else{


            document
            .getElementById("mensaje")
            .innerHTML =
            data.message ?? "Credenciales incorrectas";


        }



    } catch(error){


        console.error(error);


        document
        .getElementById("mensaje")
        .innerHTML =
        "Error de conexión con el servidor";


    }


});


</script>



</body>

</html>
