<!-- HEADER -->

<div class="flex flex-col md:flex-row
            md:items-center justify-between
            gap-6 mb-10">

    <div>

        <h1 class="text-4xl font-black text-white
                   tracking-tight italic uppercase">

            Campeonatos

        </h1>

        <p class="text-emerald-500 font-bold mt-1">

            Competencias y torneos en los que participa el club.

        </p>

    </div>


    <!-- AGREGAR -->

    <a th:href="@{/campeonatos/nuevo}"
       class="bg-[#10b981]
              hover:bg-[#059669]
              text-slate-900
              px-6 py-3
              rounded-xl
              font-bold
              flex items-center gap-2
              shadow-lg
              shadow-emerald-500/20
              transition-all
              transform active:scale-95">

        <i class="fa-solid fa-plus"></i>

        <span>
            Agregar campeonato
        </span>

    </a>

</div>


<!-- LISTADO -->

<div id="campeonatosGrid"
     class="grid grid-cols-1 md:grid-cols-2
            lg:grid-cols-3 gap-6">

    <!-- LOADING -->

    <div id="loading"
         class="col-span-full py-20 text-center">

        <div class="inline-block
                    animate-spin
                    w-10 h-10
                    border-4
                    border-emerald-500
                    border-t-transparent
                    rounded-full">
        </div>

        <p class="text-slate-500 mt-4
                  font-bold uppercase
                  tracking-widest text-xs">

            Cargando campeonatos...

        </p>

    </div>

</div>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>

    // =========================================================
    // OBTENER JWT
    // =========================================================

    function getJwt() {

        const cookie =
            document.cookie
                .split('; ')
                .find(row =>
                    row.startsWith('token=')
                );

        return cookie
            ? cookie.substring(6)
            : null;
    }


    // =========================================================
    // ESCAPAR HTML
    // =========================================================

    function escapeHtml(str) {

        const div =
            document.createElement('div');

        div.textContent =
            str ?? '';

        return div.innerHTML;
    }


    // =========================================================
    // CARGAR CAMPEONATOS
    // =========================================================

    async function cargarCampeonatos() {

        const grid =
            document.getElementById(
                'campeonatosGrid'
            );

        const token = getJwt();


        // =====================================================
        // SESIÓN
        // =====================================================

        if (!token) {

            grid.innerHTML = `

                <div class="col-span-full py-20
                            text-center
                            border-2 border-dashed
                            border-slate-800
                            rounded-[2rem]">

                    <p class="text-red-500 font-bold">

                        Sesión expirada.

                    </p>

                </div>

            `;

            return;
        }


        try {

            // =================================================
            // REQUEST
            // =================================================

            const res =
                await fetch(
                    '/api/campeonatos',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            // =================================================
            // ERROR HTTP
            // =================================================

            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar los campeonatos."
                    );

                }

                throw new Error(
                    "Error al obtener los campeonatos."
                );

            }


            // =================================================
            // RESPUESTA
            // =================================================

            const data =
                await res.json();


            console.log(
                "Respuesta /api/campeonatos:",
                data
            );


            // =================================================
            // SOPORTAR ARRAY
            // =================================================

            let campeonatos = [];


            if (Array.isArray(data)) {

                campeonatos = data;

            } else if (
                data &&
                Array.isArray(data.content)
            ) {

                campeonatos =
                    data.content;

            } else if (
                data &&
                typeof data === 'object'
            ) {

                campeonatos = [data];

            }


            grid.innerHTML = '';


            // =================================================
            // SIN CAMPEONATOS
            // =================================================

            if (campeonatos.length === 0) {

                grid.innerHTML = `

                    <div class="col-span-full py-20
                                text-center
                                border-2 border-dashed
                                border-slate-800
                                rounded-[2rem]">

                        <div class="w-16 h-16
                                    mx-auto mb-5
                                    rounded-2xl
                                    bg-slate-800
                                    flex items-center
                                    justify-center">

                            <i class="fa-solid
                                      fa-trophy
                                      text-2xl
                                      text-slate-600">
                            </i>

                        </div>


                        <p class="text-slate-500
                                  font-bold">

                            No hay campeonatos registrados.

                        </p>


                        <p class="text-slate-700
                                  text-xs mt-2">

                            Creá el primer campeonato
                            para comenzar.

                        </p>

                    </div>

                `;

                return;

            }


            // =================================================
            // MOSTRAR CAMPEONATOS
            // =================================================

            campeonatos.forEach(campeonato => {


                // =================================================
                // CANTIDAD DE PARTIDOS
                // =================================================

                const cantidadPartidos =
                    Array.isArray(campeonato.partidos)
                        ? campeonato.partidos.length
                        : 0;


                // =================================================
                // CARD
                // =================================================

                const card =
                    document.createElement('div');


                card.className =
                    `bg-[#0f172a]
                     border border-slate-800
                     p-8 rounded-[2rem]
                     hover:border-emerald-500/50
                     transition-all
                     group relative`;


                card.innerHTML = `

                    <!-- ICONO -->

                    <div class="w-14 h-14
                                bg-emerald-500/10
                                rounded-2xl
                                flex items-center
                                justify-center
                                text-emerald-500
                                mb-6">

                        <i class="fa-solid
                                  fa-trophy
                                  text-2xl">
                        </i>

                    </div>


                    <!-- NOMBRE -->

                    <h3 class="text-2xl
                               font-black
                               text-white
                               mb-2
                               italic
                               tracking-tighter">

                        ${escapeHtml(
                            campeonato.nombre || ''
                        )}

                    </h3>


                    <!-- AÑO -->

                    <p class="text-emerald-500
                              text-xs
                              font-black
                              uppercase
                              tracking-widest
                              mb-6">

                        Año:
                        ${escapeHtml(
                            String(
                                campeonato.año ?? ''
                            )
                        )}

                    </p>


                    <!-- INFORMACIÓN -->

                    <div class="border-t
                                border-slate-800
                                pt-6
                                space-y-3">


                        <!-- PARTIDOS -->

                        <div class="flex items-center gap-2">

                            <i class="fa-solid
                                      fa-futbol
                                      text-emerald-500
                                      text-xs">
                            </i>

                            <span class="text-xs
                                         font-bold
                                         text-slate-300">

                                ${cantidadPartidos}
                                partido${cantidadPartidos === 1 ? '' : 's'}

                            </span>

                        </div>

                    </div>


                    <!-- ACCIONES -->

                    <div class="mt-6 flex gap-2">


                        <!-- EDITAR -->

                        <a href="/campeonatos/nuevo?id=${campeonato.id}"
                           class="flex-1
                                  bg-emerald-500/10
                                  hover:bg-emerald-500
                                  text-emerald-500
                                  hover:text-slate-900
                                  py-3
                                  rounded-xl
                                  font-bold
                                  transition-all
                                  text-xs
                                  uppercase
                                  tracking-widest
                                  text-center">

                            <i class="fa-solid
                                      fa-pen-to-square
                                      mr-1">
                            </i>

                            Editar

                        </a>


                        <!-- ELIMINAR -->

                        <button type="button"
                                class="btn-eliminar
                                       w-12
                                       bg-slate-800
                                       hover:bg-red-500/20
                                       text-slate-400
                                       hover:text-red-500
                                       rounded-xl
                                       transition-all"
                                data-id="${campeonato.id}"
                                data-nombre="${escapeHtml(
                                    campeonato.nombre || ''
                                )}">

                            <i class="fa-solid
                                      fa-trash-can">
                            </i>

                        </button>

                    </div>

                `;


                grid.appendChild(card);

            });


            // =================================================
            // EVENTOS ELIMINAR
            // =================================================

            grid
                .querySelectorAll('.btn-eliminar')
                .forEach(btn => {

                    btn.addEventListener(
                        'click',
                        function () {

                            eliminarCampeonato(
                                this.dataset.id,
                                this.dataset.nombre
                            );

                        }
                    );

                });


        } catch (error) {

            console.error(
                "Error al cargar campeonatos:",
                error
            );


            grid.innerHTML = `

                <div class="col-span-full
                            p-10
                            bg-red-500/10
                            border border-red-500/20
                            rounded-[2rem]
                            text-red-500
                            text-center">

                    <i class="fa-solid
                              fa-circle-exclamation
                              text-xl mb-3">
                    </i>


                    <p class="font-black">

                        ERROR AL CARGAR LOS CAMPEONATOS

                    </p>


                    <p class="text-xs
                              mt-2
                              text-red-400">

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                </div>

            `;

        }

    }


    // =========================================================
    // ELIMINAR CAMPEONATO
    // =========================================================

    async function eliminarCampeonato(
        id,
        nombre
    ) {

        if (
            !confirm(
                `¿Seguro que querés eliminar el campeonato "${nombre}"?`
            )
        ) {

            return;

        }


        const token = getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return;

        }


        try {

            const res =
                await fetch(
                    `/api/campeonatos/${id}`,
                    {

                        method: 'DELETE',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            // =================================================
            // ERROR
            // =================================================

            if (!res.ok) {

                let mensaje =
                    "No se pudo eliminar el campeonato.";


                try {

                    const errorData =
                        await res.json();


                    if (errorData.mensaje) {

                        mensaje =
                            errorData.mensaje;

                    } else if (
                        errorData.message
                    ) {

                        mensaje =
                            errorData.message;

                    }

                } catch (_) {}


                throw new Error(mensaje);

            }


            // =================================================
            // ÉXITO
            // =================================================

            await cargarCampeonatos();


        } catch (error) {

            console.error(
                "Error eliminando campeonato:",
                error
            );


            alert(
                error.message ||
                "Error al eliminar el campeonato."
            );

        }

    }


    // =========================================================
    // INICIAR
    // =========================================================

    document.addEventListener(
        'DOMContentLoaded',
        function () {

            cargarCampeonatos();

        }
    );

</script>
