<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>


    // =========================================================
    // OBTENER JWT
    // =========================================================

    function getJwt() {

        const cookie =
            document.cookie
                .split('; ')
                .find(row =>
                    row.startsWith('token=')
                );

        return cookie
            ? cookie.substring(6)
            : null;

    }


    // =========================================================
    // CARGAR CAMPEONATO PARA EDITAR
    // =========================================================

    async function cargarCampeonato(id) {

        const token = getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return;

        }


        try {

            const res =
                await fetch(
                    `/api/campeonatos/${id}`,
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar el campeonato."
                    );

                }

                throw new Error(
                    "No se pudo obtener el campeonato."
                );

            }


            const campeonato =
                await res.json();


            console.log(
                "Campeonato obtenido:",
                campeonato
            );


            // =================================================
            // CARGAR DATOS
            // =================================================

            document.getElementById(
                'campeonatoId'
            ).value =
                campeonato.id;


            document.getElementById(
                'nombre'
            ).value =
                campeonato.nombre || '';


            document.getElementById(
                'año'
            ).value =
                campeonato.año || '';


            // =================================================
            // CAMBIAR MODO EDICIÓN
            // =================================================

            document.getElementById(
                'formTitle'
            ).innerText =
                "Editar Campeonato";


            document.getElementById(
                'submitButton'
            ).innerHTML =
                '<i class="fa-solid fa-pen mr-2"></i> Actualizar campeonato';


        } catch (error) {

            console.error(
                "Error cargando campeonato:",
                error
            );


            alert(
                error.message ||
                "No se pudo cargar el campeonato."
            );

        }

    }


    // =========================================================
    // INICIALIZAR
    // =========================================================

    document.addEventListener(
        'DOMContentLoaded',
        function () {


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                params.get('id');


            // Si existe ID, estamos editando

            if (id) {

                cargarCampeonato(id);

            }

        }
    );


    // =========================================================
    // GUARDAR / ACTUALIZAR
    // =========================================================

    document.getElementById(
        'campeonatoForm'
    ).addEventListener(
        'submit',
        async function (e) {

            e.preventDefault();


            const token = getJwt();


            if (!token) {

                alert("Sesión expirada.");

                window.location.href =
                    "/login";

                return;

            }


            // =================================================
            // DATOS
            // =================================================

            const id =
                document.getElementById(
                    'campeonatoId'
                ).value;


            const nombre =
                document.getElementById(
                    'nombre'
                ).value.trim();


            const año =
                document.getElementById(
                    'año'
                ).value.trim();


            // =================================================
            // VALIDACIONES
            // =================================================

            if (!nombre) {

                alert(
                    "El nombre es obligatorio."
                );

                return;

            }


            if (!año) {

                alert(
                    "El año es obligatorio."
                );

                return;

            }


            if (!/^\d{4}$/.test(año)) {

                alert(
                    "El año debe tener 4 números."
                );

                return;

            }


            // =================================================
            // OBJETO
            // =================================================

            const campeonatoData = {

                nombre: nombre,

                año: año

            };


            console.log(
                "Enviando campeonato:",
                campeonatoData
            );


            // =================================================
            // BOTÓN
            // =================================================

            const boton =
                document.getElementById(
                    'submitButton'
                );


            boton.disabled = true;


            boton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';


            try {


                // =================================================
                // URL Y MÉTODO
                // =================================================

                const url =
                    id
                        ? `/api/campeonatos/${id}`
                        : '/api/campeonatos';


                const method =
                    id
                        ? 'PUT'
                        : 'POST';


                const res =
                    await fetch(
                        url,
                        {

                            method: method,

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            },

                            body:
                                JSON.stringify(
                                    campeonatoData
                                )

                        }
                    );


                // =================================================
                // ERROR
                // =================================================

                if (!res.ok) {

                    let mensaje =
                        id
                            ? "No se pudo actualizar el campeonato."
                            : "No se pudo crear el campeonato.";


                    try {

                        const errorData =
                            await res.json();


                        if (
                            errorData.mensaje
                        ) {

                            mensaje =
                                errorData.mensaje;

                        } else if (
                            errorData.message
                        ) {

                            mensaje =
                                errorData.message;

                        } else if (
                            errorData.error
                        ) {

                            mensaje =
                                errorData.error;

                        }

                    } catch (_) {

                        const texto =
                            await res.text();


                        if (texto) {

                            console.error(
                                "Respuesta del servidor:",
                                texto
                            );

                        }

                    }


                    throw new Error(
                        mensaje
                    );

                }


                // =================================================
                // ÉXITO
                // =================================================

                alert(
                    id
                        ? "Campeonato actualizado correctamente."
                        : "Campeonato creado correctamente."
                );


                window.location.href =
                    "/campeonatos";


            } catch (error) {

                console.error(
                    "Error guardando campeonato:",
                    error
                );


                alert(
                    error.message ||
                    "Error al guardar el campeonato."
                );


                boton.disabled = false;


                boton.innerHTML =
                    '<i class="fa-solid fa-floppy-disk mr-2"></i> ' +
                    (
                        id
                            ? "Actualizar campeonato"
                            : "Guardar campeonato"
                    );

            }

        }
    );

</script>
