<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(~{::#content})}"
      lang="es">

<head>

<meta charset="UTF-8">

<title>Nuevo Campeonato</title>

<link rel="icon" href="data:,">

</head>

<body>

<div id="content" class="max-w-[1000px] mx-auto w-full">

<div class="flex items-center gap-3 sm:gap-4 mb-6 sm:mb-10">


<a th:href="@{/campeonatos}"
   class="w-10 h-10 sm:w-11 sm:h-11 shrink-0 flex items-center justify-center
          bg-[#0f172a] border border-slate-800 rounded-xl
          text-slate-400 hover:text-emerald-500
          hover:border-emerald-500/30 transition-all">

    <i class="fa-solid fa-arrow-left"></i>

</a>


<div class="min-w-0">

    <h1 id="formTitle"
        class="text-2xl sm:text-3xl md:text-4xl font-black text-white
               italic uppercase tracking-tight break-words">

        Nuevo Campeonato

    </h1>


    <p class="text-emerald-500 font-bold mt-1 text-sm sm:text-base">

        Completá los datos del campeonato.

    </p>

</div>


</div>


<form id="campeonatoForm">


<input type="hidden" id="campeonatoId">


<div class="bg-[#0f172a]
            border border-slate-800
            rounded-2xl sm:rounded-[2.5rem]
            p-5 sm:p-8">



    <div class="flex items-center gap-3 sm:gap-4 mb-6 sm:mb-8">

        <div class="w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-2xl
                    bg-emerald-500/10
                    flex items-center justify-center
                    text-emerald-500">

            <i class="fa-solid fa-trophy text-lg sm:text-xl"></i>

        </div>


        <div class="min-w-0">

            <h2 class="text-lg sm:text-xl font-black
                       text-white
                       uppercase italic">

                Datos del campeonato

            </h2>


            <p class="text-[10px] sm:text-xs text-slate-600
                      font-bold uppercase
                      tracking-widest mt-1">

                Información general

            </p>

        </div>

    </div>


    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">


        <div class="space-y-2 min-w-0">

            <label for="nombre"
                   class="text-[10px]
                          font-black
                          text-slate-500
                          uppercase
                          tracking-widest
                          ml-1">

                Nombre

            </label>


            <input type="text"
                   id="nombre"
                   required
                   maxlength="100"
                   placeholder="Ej: Liga Regional, Torneo Apertura..."
                   class="w-full min-w-0
                          bg-[#0a0f1d]
                          border border-slate-800
                          text-slate-200
                          px-4 sm:px-5 py-3.5 sm:py-4
                          rounded-xl
                          outline-none
                          focus:ring-2
                          focus:ring-emerald-500
                          focus:border-transparent
                          transition-all">

        </div>

        <div class="space-y-2 min-w-0">

            <label for="año"
                   class="text-[10px]
                          font-black
                          text-slate-500
                          uppercase
                          tracking-widest
                          ml-1">

                Año

            </label>


            <input type="text"
                   id="año"
                   required
                   maxlength="4"
                   placeholder="Ej: 2026"
                   class="w-full min-w-0
                          bg-[#0a0f1d]
                          border border-slate-800
                          text-slate-200
                          px-4 sm:px-5 py-3.5 sm:py-4
                          rounded-xl
                          outline-none
                          focus:ring-2
                          focus:ring-emerald-500
                          focus:border-transparent
                          transition-all">

        </div>

    </div>

    <div class="flex flex-col-reverse sm:flex-row
                sm:justify-end
                gap-3
                mt-6 sm:mt-8
                pt-6 sm:pt-8
                border-t border-slate-800">



        <a th:href="@{/campeonatos}"
           class="w-full sm:w-auto
                  text-center
                  px-6 py-3
                  rounded-xl
                  border border-slate-800
                  bg-[#0a0f1d]
                  text-slate-400
                  hover:text-white
                  font-bold
                  transition-all">

            Cancelar

        </a>


        <button type="submit"
                id="submitButton"
                class="w-full sm:w-auto
                       px-8 py-3
                       rounded-xl
                       bg-emerald-500
                       hover:bg-emerald-400
                       text-slate-900
                       font-black
                       uppercase
                       text-xs
                       tracking-widest
                       shadow-lg
                       shadow-emerald-500/20
                       transition-all">

            <i class="fa-solid fa-floppy-disk mr-2"></i>

            Guardar campeonato

        </button>

    </div>

</div>


</form>

<script>


    function getJwt() {

        const cookie =
            document.cookie
                .split('; ')
                .find(row =>
                    row.startsWith('token=')
                );

        return cookie
            ? cookie.substring(6)
            : null;

    }


    async function cargarCampeonato(id) {

        const token = getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return;

        }


        try {

            const res =
                await fetch(
                    `/api/campeonatos/${id}`,
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar el campeonato."
                    );

                }

                throw new Error(
                    "No se pudo obtener el campeonato."
                );

            }


            const campeonato =
                await res.json();


            console.log(
                "Campeonato obtenido:",
                campeonato
            );

            document.getElementById(
                'campeonatoId'
            ).value =
                campeonato.id;


            document.getElementById(
                'nombre'
            ).value =
                campeonato.nombre || '';


            document.getElementById(
                'año'
            ).value =
                campeonato.año || '';

            document.getElementById(
                'formTitle'
            ).innerText =
                "Editar Campeonato";


            document.getElementById(
                'submitButton'
            ).innerHTML =
                '<i class="fa-solid fa-pen mr-2"></i> Actualizar campeonato';


        } catch (error) {

            console.error(
                "Error cargando campeonato:",
                error
            );


            alert(
                error.message ||
                "No se pudo cargar el campeonato."
            );

        }

    }


    document.addEventListener(
        'DOMContentLoaded',
        function () {


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                params.get('id');


            if (id) {

                cargarCampeonato(id);

            }

        }
    );


    document.getElementById(
        'campeonatoForm'
    ).addEventListener(
        'submit',
        async function (e) {

            e.preventDefault();


            const token = getJwt();


            if (!token) {

                alert("Sesión expirada.");

                window.location.href =
                    "/login";

                return;

            }

            const id =
                document.getElementById(
                    'campeonatoId'
                ).value;


            const nombre =
                document.getElementById(
                    'nombre'
                ).value.trim();


            const año =
                document.getElementById(
                    'año'
                ).value.trim();


            if (!nombre) {

                alert(
                    "El nombre es obligatorio."
                );

                return;

            }


            if (!año) {

                alert(
                    "El año es obligatorio."
                );

                return;

            }


            if (!/^\d{4}$/.test(año)) {

                alert(
                    "El año debe tener 4 números."
                );

                return;

            }


            const campeonatoData = {

                nombre: nombre,

                año: año

            };


            console.log(
                "Enviando campeonato:",
                campeonatoData
            );


            const boton =
                document.getElementById(
                    'submitButton'
                );


            boton.disabled = true;


            boton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';


            try {


                const url =
                    id
                        ? `/api/campeonatos/${id}`
                        : '/api/campeonatos';


                const method =
                    id
                        ? 'PUT'
                        : 'POST';


                const res =
                    await fetch(
                        url,
                        {

                            method: method,

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            },

                            body:
                                JSON.stringify(
                                    campeonatoData
                                )

                        }
                    );


                if (!res.ok) {

                    let mensaje =
                        id
                            ? "No se pudo actualizar el campeonato."
                            : "No se pudo crear el campeonato.";


                    try {

                        const errorData =
                            await res.json();


                        if (
                            errorData.mensaje
                        ) {

                            mensaje =
                                errorData.mensaje;

                        } else if (
                            errorData.message
                        ) {

                            mensaje =
                                errorData.message;

                        } else if (
                            errorData.error
                        ) {

                            mensaje =
                                errorData.error;

                        }

                    } catch (_) {

                        const texto =
                            await res.text();


                        if (texto) {

                            console.error(
                                "Respuesta del servidor:",
                                texto
                            );

                        }

                    }


                    throw new Error(
                        mensaje
                    );

                }


                alert(
                    id
                        ? "Campeonato actualizado correctamente."
                        : "Campeonato creado correctamente."
                );


                window.location.href =
                    "/campeonatos";


            } catch (error) {

                console.error(
                    "Error guardando campeonato:",
                    error
                );


                alert(
                    error.message ||
                    "Error al guardar el campeonato."
                );


                boton.disabled = false;


                boton.innerHTML =
                    '<i class="fa-solid fa-floppy-disk mr-2"></i> ' +
                    (
                        id
                            ? "Actualizar campeonato"
                            : "Guardar campeonato"
                    );

            }

        }
    );

</script>

</div>

</body>

</html>
