<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="mainLayout(content)"
      lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Complejo Deportivo Justiniano Posse</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0f1d;
            color: #f8fafc;
        }

        .sidebar-active {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid #10b981;
            color: #10b981;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }


        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 768px) {

            .sidebar {
                width: min(18rem, 85vw);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                z-index: 40;
            }

            .sidebar.open + .sidebar-overlay {
                display: block;
            }

            .main-content {
                margin-left: 0 !important;
                width: 100%;
            }

            header {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }

            #pageTitle {
                max-width: 55vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #usuarioEmail,
            #usuarioRol {
                max-width: 30vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .main-content > section {
                padding: 1rem !important;
            }

        }

        @media (max-width: 480px) {

            header {
                height: 4.5rem;
            }

            #pageTitle {
                font-size: 0.9rem;
                max-width: 42vw;
            }

            .main-content > section {
                padding: 0.75rem !important;
            }

            #usuarioAvatar {
                width: 2.25rem;
                height: 2.25rem;
                min-width: 2.25rem;
            }

            .sidebar .p-8 {
                padding: 1.25rem;
            }

            .sidebar nav {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }

            .sidebar .p-6 {
                padding: 1rem;
            }

        }

    </style>

</head>


<body class="flex min-h-screen">


<aside id="sidebar"
       class="sidebar fixed inset-y-0 left-0 w-72 bg-[#0f172a] border-r border-slate-800 flex flex-col z-50">



    <div class="p-8">

        <div class="flex items-center gap-4">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFoWW9Qj6yO6eX2UjfyWmJNxQw_9EheO0KJF-zaevWvl1fBtSP_zBFzYk&s=10"
                class="w-12 h-12 object-contain"
                alt="Logo CDJP">

            <div>

                <h2 class="text-xl font-extrabold tracking-tighter">
                </h2>

                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest leading-tight">
                    Complejo Deportivo<br>
                    Justiniano Posse
                </p>

            </div>

        </div>

    </div>


    <nav class="flex-1 px-4 space-y-1 overflow-y-auto">


        <a th:href="@{/dashboard}"
           data-page="dashboard"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-layer-group w-5"></i>

            <span class="font-semibold">
                Inicio
            </span>

        </a>


        <a th:href="@{/jugadores}"
           data-page="jugadores"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-users w-5"></i>

            <span class="font-semibold">
                Jugadores
            </span>

        </a>


        <a th:href="@{/categorias}"
           data-page="categorias"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-tags w-5"></i>

            <span class="font-semibold">
                Categorías
            </span>

        </a>


        <a th:href="@{/entrenadores}"
           data-page="entrenadores"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-user-tie w-5"></i>

            <span class="font-semibold">
                Entrenadores
            </span>

        </a>


        <a th:href="@{/partidos}"
           data-page="partidos"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-calendar-days w-5"></i>

            <span class="font-semibold">
                Partidos
            </span>

        </a>


        <a th:href="@{/campeonatos}"
           data-page="campeonatos"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-trophy w-5"></i>

            <span class="font-semibold">
                Campeonatos
            </span>

        </a>


        <a th:href="@{/estadisticas}"
           data-page="estadisticas"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-chart-line w-5"></i>

            <span class="font-semibold">
                Estadísticas
            </span>

        </a>


        <a th:href="@{/incidencias}"
           data-page="incidencias"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-notes-medical w-5"></i>

            <span class="font-semibold">
                Incidencias
            </span>

        </a>


        <a th:href="@{/reportes}"
           data-page="reportes"
           data-roles="ADMIN,ENTRENADOR,USUARIO"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all border-t border-slate-800 pt-4">

            <i class="fa-solid fa-file-contract w-5"></i>

            <span class="font-semibold">
                Reportes
            </span>

        </a>



        <a th:href="@{/configuracion}"
           data-page="configuracion"
           data-roles="ADMIN"
           id="menuConfiguracion"
           class="menu-item flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white rounded-xl transition-all">

            <i class="fa-solid fa-gear w-5"></i>

            <span class="font-semibold">
                Configuración
            </span>

        </a>


    </nav>


    <div class="p-6">

        <div class="bg-emerald-500/5 rounded-2xl p-4 border border-emerald-500/10 mb-4">

            <div class="flex items-center gap-2 text-emerald-500 mb-1">

                <i class="fa-solid fa-shield-halved text-xs"></i>

                <span class="text-[10px] font-black uppercase tracking-widest">
                    Desde 1973
                </span>

            </div>

            <p class="text-[10px] text-slate-400 leading-relaxed">
                El fútbol de Justiniano Posse en una sola plataforma.
            </p>

        </div>

        <button
            onclick="logout()"
            class="flex items-center gap-4 text-red-500 font-bold px-4 hover:translate-x-2 transition-transform">

            <i class="fa-solid fa-arrow-right-from-bracket"></i>

            <span>
                Cerrar sesión
            </span>

        </button>

    </div>

</aside>


<main class="main-content flex-1 ml-72 flex flex-col min-h-screen">



    <header
        class="h-20 border-b border-slate-800 flex items-center px-10 justify-between sticky top-0 bg-[#0a0f1d]/80 backdrop-blur-xl z-40">


        <div class="flex items-center gap-3">

            <button
                onclick="toggleSidebar()"
                class="md:hidden text-white text-xl">

                <i class="fa-solid fa-bars"></i>

            </button>


            <h1
                id="pageTitle"
                class="font-bold text-slate-200">

                Complejo Deportivo Justiniano Posse

            </h1>

        </div>


        <div class="flex items-center gap-6">


            
            <div
                class="flex items-center gap-3 pl-6 border-l border-slate-800">

                <div class="text-right">

                    <p
                        id="usuarioEmail"
                        class="text-xs font-bold text-slate-200">

                        Usuario

                    </p>


                    <p
                        id="usuarioRol"
                        class="text-[10px] text-emerald-500 font-black uppercase tracking-widest">

                        Usuario

                    </p>

                </div>


                <div
                    id="usuarioAvatar"
                    class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-500 font-bold">

                    US

                </div>

            </div>

        </div>

    </header>


    <section class="p-10 max-w-[1600px] mx-auto w-full">

        <div th:replace="${content}"></div>

    </section>

</main>


<script>


    function getJwt() {

        const cookie = document.cookie
            .split('; ')
            .find(row => row.startsWith('token='));

        return cookie
            ? cookie.split('=')[1]
            : null;

    }


    function obtenerRolUsuario(payload) {

        let rol =
            payload.rol ||
            payload.role ||
            payload.authorities ||
            null;


        if (Array.isArray(rol)) {

            rol = rol[0];

        }


        if (!rol) {

            return null;

        }


        rol = String(rol)
            .replace("ROLE_", "")
            .replace("Role_", "")
            .replace("ROLE", "")
            .trim()
            .toUpperCase();


        return rol;

    }


    function aplicarPermisosMenu(rol) {

        const menuItems =
            document.querySelectorAll("[data-roles]");


        menuItems.forEach(item => {

            const rolesPermitidos =
                item.dataset.roles
                    .split(",")
                    .map(r => r.trim().toUpperCase());


            if (!rolesPermitidos.includes(rol)) {

                item.style.display = "none";

            } else {

                item.style.display = "flex";

            }

        });


        const dashboard =
            document.querySelector('[data-page="dashboard"]');


        if (dashboard) {

            dashboard.style.display = "flex";

        }

    }

    function cargarUsuario() {

        const token = getJwt();


        if (!token) {

            window.location.href = "/login";

            return;

        }


        try {

            const partes =
                token.split('.');


            if (partes.length !== 3) {

                throw new Error("JWT inválido");

            }


            const payload =
                JSON.parse(
                    atob(
                        partes[1]
                            .replace(/-/g, '+')
                            .replace(/_/g, '/')
                    )
                );


            const email =
                payload.sub ||
                payload.email ||
                "Usuario";


            document.getElementById(
                "usuarioEmail"
            ).innerText = email;



            const rol =
                obtenerRolUsuario(payload);


            if (!rol) {

                console.error(
                    "No se encontró el rol dentro del JWT"
                );

                return;

            }



            window.usuarioRol = rol;


            localStorage.setItem(
                "rol",
                rol
            );



            let rolTexto;


            switch (rol) {

                case "ADMIN":

                    rolTexto = "Administrador";

                    break;


                case "ENTRENADOR":

                    rolTexto = "Entrenador";

                    break;


                case "USUARIO":

                    rolTexto = "Usuario";

                    break;


                default:

                    rolTexto = rol;

            }


            document.getElementById(
                "usuarioRol"
            ).innerText = rolTexto;



            const iniciales =
                email
                    .substring(0, 2)
                    .toUpperCase();


            document.getElementById(
                "usuarioAvatar"
            ).innerText = iniciales;



            aplicarPermisosMenu(rol);


        } catch (error) {

            console.error(
                "Error leyendo JWT:",
                error
            );

        }

    }


    function marcarPaginaActual() {

        const path =
            window.location.pathname;


        const menuItems =
            document.querySelectorAll(".menu-item");


        menuItems.forEach(item => {

            item.addEventListener("click", function () {
                if (window.innerWidth <= 768) {
                    document.getElementById("sidebar").classList.remove("open");
                }
            });

            const page =
                item.dataset.page;


            if (
                path.includes("/" + page)
            ) {

                item.classList.add(
                    "sidebar-active"
                );


                item.classList.remove(
                    "text-slate-400"
                );

            }

        });



        const titulos = {

            dashboard: "Inicio",

            jugadores: "Jugadores",

            categorias: "Categorías",

            entrenadores: "Entrenadores",

            partidos: "Partidos",

            campeonatos: "Campeonatos",

            estadisticas: "Estadísticas",

            incidencias: "Incidencias",

            reportes: "Reportes",

            configuracion: "Configuración"

        };


        const paginaEncontrada =
            Object.keys(titulos)
                .find(
                    p => path.includes("/" + p)
                );


        if (paginaEncontrada) {

            document.getElementById(
                "pageTitle"
            ).innerText =
                titulos[paginaEncontrada];

        }

    }


    function logout() {

        document.cookie =
            "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";


        localStorage.removeItem("token");

        localStorage.removeItem("rol");

        localStorage.removeItem("usuario");


        window.location.href =
            "/login";

    }


    function toggleSidebar() {

        const sidebar =
            document.getElementById("sidebar");


        sidebar.classList.toggle("open");

    }


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            cargarUsuario();

            marcarPaginaActual();

        }
    );

</script>


</body>

</html>
