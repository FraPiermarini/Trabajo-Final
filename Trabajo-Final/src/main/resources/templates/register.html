<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Club Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">
    <div class="flex bg-white rounded-2xl shadow-2xl overflow-hidden max-w-4xl w-full">
        <!-- Formulario -->
        <div class="w-full md:w-1/2 p-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Crear Cuenta</h1>
            <p class="text-slate-500 mb-6">Completa tus datos para el registro.</p>
            
            <div id="alert" class="hidden p-3 mb-4 rounded-lg text-sm"></div>

            <form id="registerForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="nombre" placeholder="Nombre" required class="w-full p-3 border rounded-lg">
                    <input type="text" id="apellido" placeholder="Apellido" required class="w-full p-3 border rounded-lg">
                </div>
                <input type="email" id="email" placeholder="Email" required class="w-full p-3 border rounded-lg">
                <input type="password" id="password" placeholder="Contraseña (min 8)" required class="w-full p-3 border rounded-lg">
                
                <button type="submit" id="btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                    Registrarme
                </button>
            </form>
            <p class="mt-6 text-center text-sm">¿Ya tienes cuenta? <a th:href="@{/login}" class="text-blue-600 font-bold">Inicia sesión</a></p>
        </div>
        <!-- Imagen -->
        <div class="hidden md:block w-1/2 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=600&q=80');"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('alert');
            const data = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/usuarios/registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert.className = "p-3 mb-4 rounded-lg text-sm bg-green-100 text-green-700 block";
                    alert.innerText = "¡Éxito! Redirigiendo...";
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    const err = await res.json();
                    alert.className = "p-3 mb-4 rounded-lg text-sm bg-red-100 text-red-700 block";
                    alert.innerText = err.message || "Error en el registro";
                }
            } catch(e) { alert.innerText = "Error de conexión"; }
        });
    </script>
</body>
</html>
