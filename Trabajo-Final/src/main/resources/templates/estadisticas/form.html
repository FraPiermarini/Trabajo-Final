<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(~{::#content})}"
      lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva Estadística</title>
    <link rel="icon" href="data:,">
</head>

<body>

<div id="content" class="max-w-[1200px] mx-auto w-full">

<div class="flex items-center gap-3 sm:gap-4 mb-6 sm:mb-10">

    <a th:href="@{/estadisticas}"

</div>


<form id="estadisticaForm" class="space-y-5 sm:space-y-8">

<input type="hidden"
       id="estadisticaId">


<div class="bg-[#0f172a]

            p-5 sm:p-8">

        <div class="min-w-0">

                Partido y jugador

            </h3>

                      font-bold uppercase

    </div>


    <div class="grid grid-cols-1 md:grid-cols-4 gap-5 sm:gap-6">


        <div class="min-w-0">

            <label for="categoriaId"
                   class="block text-[10px]
                          font-black text-slate-500

                Categoría

            </label>

            <select id="categoriaId"
                    required
                    class="w-full min-w-0

                           border border-slate-800
                           text-slate-200
                           px-4 py-3
                           rounded-xl
                           outline-none
                           focus:ring-2
                           focus:ring-emerald-500

                           transition-all">

                <option value="">
                    Cargando categorías...

            </select>

        </div>


        <div class="min-w-0">

            <label for="campeonatoId"
                   class="block text-[10px]
                          font-black text-slate-500
                          uppercase tracking-widest mb-2">

                Campeonato

            </label>

            <select id="campeonatoId"
                    required
                    class="w-full min-w-0
                           bg-[#0a0f1d]
                           border border-slate-800
                           text-slate-200
                           px-4 py-3
                           rounded-xl
                           outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:border-transparent
                           transition-all">

                <option value="">
                    Cargando campeonatos...
                </option>

            </select>

        </div>


        <div class="min-w-0">

            <label for="partidoId"
                   class="block text-[10px]
                          font-black text-slate-500
                          uppercase tracking-widest mb-2">

                Partido

            </label>

            <select id="partidoId"
                    required
                    disabled
                    class="w-full min-w-0
                           bg-[#0a0f1d]
                           border border-slate-800
                           text-slate-200
                           px-4 py-3
                           rounded-xl
                           outline-none
                           focus:ring-2
                           focus:ring-emerald-500
                           focus:border-transparent
                           transition-all
                           disabled:opacity-50
                           disabled:cursor-not-allowed">

                <option value="">
                    Seleccione primero un campeonato y una categoría...
                </option>

            </select>

        </div>


        <div class="min-w-0">

            <label for="jugadorId"
                   class="block text-[10px]
                          font-black text-slate-500
                          uppercase tracking-widest mb-2">

                Jugador

            </label>

            <input type="hidden"
                   id="jugadorId">

            <input type="text"
                   id="jugadorBusqueda"
                   list="jugadoresSugerencias"
                   required
                   disabled
                   autocomplete="off"
                   placeholder="Buscar jugador..."
                   class="w-full min-w-0
                          bg-[#0a0f1d]
                          border border-slate-800
                          text-slate-200
                          px-4 py-3
                          rounded-xl
                          outline-none
                          focus:ring-2
                          focus:ring-emerald-500
                          focus:border-transparent
                          transition-all
                          disabled:opacity-50
                          disabled:cursor-not-allowed">

        </div>

    </div>

</div>

        <div class="min-w-0">

                Goles

            </label>

            <input type="number"

                   min="0"
                   value="0"
                   required

                          text-slate-200
                          px-4 py-3

        <div class="min-w-0">

                          border border-slate-800
                          text-slate-200
                          px-4 py-3
                          rounded-xl
                          outline-none
                          focus:ring-2
                          focus:ring-emerald-500
                          focus:border-transparent

        </div>


        <div class="min-w-0">

            <label for="rojas"

                          font-black text-slate-500

            </label>

            <input type="number"
                   id="rojas"
                   min="0"
                   value="0"
                   required

                          bg-[#0a0f1d]
                          border border-slate-800
                          text-slate-200
                          px-4 py-3
                          rounded-xl
                          outline-none
                          focus:ring-2
                          focus:ring-emerald-500
                          focus:border-transparent
                          transition-all">

        </div>


        <div class="min-w-0">

            <label for="amarillas"
                   class="block text-[10px]
                          font-black text-slate-500
                          uppercase tracking-widest mb-2">

                Tarjetas amarillas

            </label>

            <input type="number"
                   id="amarillas"
                   min="0"
                   value="0"
                   required
                   class="w-full min-w-0
                          bg-[#0a0f1d]
                          border border-slate-800
                          text-slate-200
                          px-4 py-3
                          rounded-xl
                          outline-none
                          focus:ring-2
                          focus:ring-emerald-500
                          focus:border-transparent
                          transition-all">

        </div>



        <div class="flex items-center min-w-0">

            <label class="flex items-center gap-3 cursor-pointer">

                <input type="checkbox"
                       id="titular"
                       class="w-5 h-5 shrink-0 rounded
                              border-slate-600
                              bg-[#0a0f1d]
                              text-emerald-500
                              focus:ring-emerald-500">

                <span class="text-slate-300 font-medium">

                    Fue titular

                </span>

            </label>

        </div>

    </div>

</div>


<div class="flex flex-col-reverse sm:flex-row
            sm:justify-end gap-3">

    <a th:href="@{/estadisticas}"
       class="w-full sm:w-auto
              text-center
              px-6 py-3 rounded-xl
              border border-slate-800
              bg-[#0f172a]
              text-slate-400
              hover:text-white
              hover:border-slate-700
              font-bold transition-all">

        Cancelar

    </a>


    <button type="submit"
            id="submitButton"
            class="w-full sm:w-auto
                   px-8 py-3 rounded-xl
                   bg-emerald-500
                   hover:bg-emerald-400
                   text-slate-900
                   font-black uppercase
                   text-xs tracking-widest
                   shadow-lg
                   shadow-emerald-500/20
                   transition-all">

        <i class="fa-solid fa-floppy-disk mr-2"></i>

        Guardar estadística

    </button>

</div>

</form>


<script>


    let partidosDisponibles = [];

    let jugadoresDisponibles = [];

    let campeonatosDisponibles = [];


    function getJwt() {

        const cookie =
            document.cookie
                .split('; ')
                .find(row =>
                    row.startsWith('token=')
                );

        return cookie
            ? cookie.substring(6)
            : null;
    }



    function obtenerArray(data) {

        if (Array.isArray(data)) {

            return data;

        }

        if (
            data &&
            Array.isArray(data.content)
        ) {

            return data.content;

        }

        if (
            data &&
            typeof data === 'object'
        ) {

            return [data];

        }

        return [];

    }



    async function cargarCampeonatos() {

        const select =
            document.getElementById('campeonatoId');

        const token =
            getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return false;
        }


        try {

            const res =
                await fetch(
                    '/api/campeonatos',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar los campeonatos."
                    );

                }

                throw new Error(
                    "No se pudieron cargar los campeonatos."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/campeonatos:",
                data
            );


            campeonatosDisponibles =
                obtenerArray(data);


            select.innerHTML = `

                <option value="">
                    Seleccione un campeonato...
                </option>

            `;


            if (campeonatosDisponibles.length === 0) {

                select.innerHTML = `

                    <option value="">
                        No hay campeonatos registrados
                    </option>

                `;

                return false;
            }


            campeonatosDisponibles.forEach(campeonato => {

                if (!campeonato.id) {
                    return;
                }


                const option =
                    document.createElement('option');


                option.value =
                    campeonato.id;


                const nombre =
                    campeonato.nombre ??
                    campeonato.descripcion ??
                    `Campeonato #${campeonato.id}`;


                option.textContent =
                    campeonato.año
                        ? `${nombre} - ${campeonato.año}`
                        : nombre;


                select.appendChild(option);

            });


            return true;


        } catch (error) {

            console.error(
                "Error cargando campeonatos:",
                error
            );


            select.innerHTML = `

                <option value="">
                    Error al cargar campeonatos
                </option>

            `;


            alert(
                error.message ||
                "No se pudieron cargar los campeonatos."
            );


            return false;

        }

    }


    async function cargarCategorias() {

        const select =
            document.getElementById('categoriaId');

        const token =
            getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return false;
        }


        try {

            const res =
                await fetch(
                    '/api/categorias',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


        if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar las categorías."
                    );

                }

                throw new Error(
                    "No se pudieron cargar las categorías."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/categorias:",
                data
            );


            const categorias =
                obtenerArray(data);


            select.innerHTML = `

                <option value="">
                    Seleccione una categoría...
                </option>

            `;


            if (categorias.length === 0) {

                select.innerHTML = `

                    <option value="">
                        No hay categorías registradas
                    </option>

                `;

                return false;
            }


            categorias.forEach(categoria => {

                if (!categoria.id) {
                    return;
                }


                const option =
                    document.createElement('option');


                option.value =
                    categoria.id;


                const nombre =
                    categoria.nombre ??
                    categoria.descripcion ??
                    `Categoría #${categoria.id}`;


                option.textContent =
                    nombre;


                select.appendChild(option);

            });


            return true;


        } catch (error) {

            console.error(
                "Error cargando categorías:",
                error
            );


            select.innerHTML = `

                <option value="">
                    Error al cargar categorías
                </option>

            `;


            alert(
                error.message ||
                "No se pudieron cargar las categorías."
            );


            return false;

        }

    }


    async function cargarPartidos() {

        const token =
            getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return false;
        }


        try {

            const res =
                await fetch(
                    '/api/partidos',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar los partidos."
                    );

                }

                throw new Error(
                    "No se pudieron cargar los partidos."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/partidos:",
                data
            );


            partidosDisponibles =
                obtenerArray(data);


            return true;


        } catch (error) {

            console.error(
                "Error cargando partidos:",
                error
            );


            alert(
                error.message ||
                "No se pudieron cargar los partidos."
            );


            return false;

        }

    }


    async function cargarJugadores() {

        const token =
            getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return false;
        }


        try {

            const res =
                await fetch(
                    '/api/jugadores',
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar los jugadores."
                    );

                }

                throw new Error(
                    "No se pudieron cargar los jugadores."
                );

            }


            const data =
                await res.json();


            console.log(
                "Respuesta /api/jugadores:",
                data
            );


            jugadoresDisponibles =
                obtenerArray(data);


            return true;


        } catch (error) {

            console.error(
                "Error cargando jugadores:",
                error
            );


            alert(
                error.message ||
                "No se pudieron cargar los jugadores."
            );


            return false;

        }

    }


    function mostrarPartidosPorCategoria(categoriaId) {

        const select =
            document.getElementById('partidoId');

        const campeonatoId =
            document.getElementById('campeonatoId').value;


        select.innerHTML = `

            <option value="">
                Seleccione un partido...
            </option>

        `;


        select.disabled = true;


        if (!campeonatoId) {

            select.innerHTML = `

                <option value="">
                    Seleccione primero un campeonato...
                </option>

            `;

            return;
        }


        if (!categoriaId) {

            select.innerHTML = `

                <option value="">
                    Seleccione primero una categoría...
                </option>

            `;

            return;
        }


        const partidosFiltrados =
            partidosDisponibles.filter(partido =>
                String(partido.categoriaId) ===
                String(categoriaId) &&
                String(partido.campeonatoId) ===
                String(campeonatoId)
            );


        if (partidosFiltrados.length === 0) {

            select.innerHTML = `

                <option value="">
                    No hay partidos en este campeonato y categoría
                </option>

            `;

            return;
        }


        partidosFiltrados.forEach(partido => {

            if (!partido.id) {
                return;
            }


            const option =
                document.createElement('option');


            option.value =
                partido.id;


            const condicion =
                partido.local === true ||
                partido.local === "true"
                    ? "Local"
                    : "Visitante";


            option.textContent =
                `${partido.fecha || 'Sin fecha'} - `
                + `${condicion} vs `
                + `${partido.rival || 'Sin rival'}`;


            select.appendChild(option);

        });


        select.disabled = false;

    }


    function mostrarJugadoresPorCategoria(categoriaId) {

        const input =
            document.getElementById('jugadorBusqueda');

        const hidden =
            document.getElementById('jugadorId');

        const datalist =
            document.getElementById('jugadoresSugerencias');


        input.value = '';
        hidden.value = '';
        datalist.innerHTML = '';

        input.disabled = true;


        if (!categoriaId) {

            input.placeholder =
                'Seleccione primero una categoría...';

            return;
        }


        const jugadoresFiltrados =
            jugadoresDisponibles.filter(jugador =>
                String(jugador.categoriaId) ===
                String(categoriaId)
            );


        if (jugadoresFiltrados.length === 0) {

            input.placeholder =
                'No hay jugadores en esta categoría';

            return;
        }


        jugadoresFiltrados.forEach(jugador => {

            if (!jugador.id) {
                return;
            }


            const nombre =
                jugador.nombre ??
                jugador.nombres ??
                "";


            const apellido =
                jugador.apellido ??
                jugador.apellidos ??
                "";


            const nombreCompleto =
                `${nombre} ${apellido}`.trim()
                || `Jugador #${jugador.id}`;


            const option =
                document.createElement('option');


            option.value =
                nombreCompleto;

            option.dataset.id =
                jugador.id;


            datalist.appendChild(option);

        });


        input.placeholder =
            'Buscar jugador por nombre...';

        input.disabled = false;

    }


    document.getElementById(
        'jugadorBusqueda'
    ).addEventListener(
        'input',
        function () {

            const texto =
                this.value.trim().toLowerCase();

            const hidden =
                document.getElementById('jugadorId');

            const opciones =
                document.querySelectorAll(
                    '#jugadoresSugerencias option'
                );


            hidden.value = '';


            for (const opcion of opciones) {

                if (
                    opcion.value.trim().toLowerCase() ===
                    texto
                ) {

                    hidden.value =
                        opcion.dataset.id;

                    break;
                }

            }

        }
    );


    document.getElementById(
        'categoriaId'
    ).addEventListener(
        'change',
        function () {

            const categoriaId =
                this.value;


            mostrarPartidosPorCategoria(
                categoriaId
            );


            mostrarJugadoresPorCategoria(
                categoriaId
            );

        }
    );


    document.getElementById(
        'campeonatoId'
    ).addEventListener(
        'change',
        function () {

            const categoriaId =
                document.getElementById(
                    'categoriaId'
                ).value;


            mostrarPartidosPorCategoria(
                categoriaId
            );

        }
    );


    async function cargarDatosEstadistica(id) {

        const token =
            getJwt();


        if (!token) {

            alert("Sesión expirada.");

            window.location.href =
                "/login";

            return;

        }


        try {

            const res =
                await fetch(
                    `/api/estadisticas/${id}`,
                    {

                        method: 'GET',

                        headers: {

                            'Authorization':
                                'Bearer ' + token,

                            'Accept':
                                'application/json'

                        }

                    }
                );


            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "No tenés permisos para consultar la estadística."
                    );

                }


                if (res.status === 404) {

                    throw new Error(
                        "No se encontró la estadística."
                    );

                }


                throw new Error(
                    "No se pudo cargar la estadística."
                );

            }


            const estadistica =
                await res.json();


            console.log(
                "Estadística obtenida:",
                estadistica
            );


            document.getElementById(
                'estadisticaId'
            ).value =
                estadistica.id || id;


            const partido =
                partidosDisponibles.find(
                    p =>
                        String(p.id) ===
                        String(estadistica.partidoId)
                );


            if (
                partido &&
                partido.categoriaId
            ) {

                const campeonatoSelect =
                    document.getElementById(
                        'campeonatoId'
                    );


                campeonatoSelect.value =
                    String(
                        partido.campeonatoId ?? ''
                    );


                const categoriaSelect =
                    document.getElementById(
                        'categoriaId'
                    );


                categoriaSelect.value =
                    String(
                        partido.categoriaId
                    );


                mostrarPartidosPorCategoria(
                    partido.categoriaId
                );


                mostrarJugadoresPorCategoria(
                    partido.categoriaId
                );

            }


            document.getElementById(
                'partidoId'
            ).value =
                String(
                    estadistica.partidoId ?? ''
                );


            const jugadorEditado =
                jugadoresDisponibles.find(
                    jugador =>
                        String(jugador.id) ===
                        String(estadistica.jugadorId)
                );


            if (jugadorEditado) {

                const nombre =
                    jugadorEditado.nombre ??
                    jugadorEditado.nombres ??
                    "";


                const apellido =
                    jugadorEditado.apellido ??
                    jugadorEditado.apellidos ??
                    "";


                document.getElementById(
                    'jugadorBusqueda'
                ).value =
                    `${nombre} ${apellido}`.trim();


                document.getElementById(
                    'jugadorId'
                ).value =
                    String(
                        estadistica.jugadorId
                    );

            }


            document.getElementById(
                'minutos'
            ).value =
                estadistica.minutos ?? 0;


            document.getElementById(
                'goles'
            ).value =
                estadistica.goles ?? 0;


            document.getElementById(
                'asistencias'
            ).value =
                estadistica.asistencias ?? 0;


            document.getElementById(
                'rojas'
            ).value =
                estadistica.rojas ?? 0;


            document.getElementById(
                'amarillas'
            ).value =
                estadistica.amarillas ?? 0;


            document.getElementById(
                'titular'
            ).checked =
                estadistica.titular === true;


            document.getElementById(
                'formTitle'
            ).innerText =
                "Editar Estadística";


            document.getElementById(
                'formDescription'
            ).innerText =
                "Modificá el rendimiento de un jugador en un partido.";


            document.getElementById(
                'submitButton'
            ).innerHTML =
                '<i class="fa-solid fa-pen-to-square mr-2"></i> Actualizar estadística';


        } catch (error) {

            console.error(
                "Error cargando estadística:",
                error
            );


            alert(
                error.message ||
                "No se pudo cargar la estadística."
            );

        }

    }


    document.addEventListener(
        'DOMContentLoaded',
        async function () {

            const token =
                getJwt();


            if (!token) {

                alert("Sesión expirada.");

                window.location.href =
                    "/login";

                return;

            }


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                params.get('id');


            const campeonatosCargados =
                await cargarCampeonatos();


            if (!campeonatosCargados) {
                return;
            }


            const categoriasCargadas =
                await cargarCategorias();


            if (!categoriasCargadas) {
                return;
            }


            await Promise.all([

                cargarPartidos(),

                cargarJugadores()

            ]);


            if (id) {

                await cargarDatosEstadistica(id);

            }

        }
    );


    document.getElementById(
        'estadisticaForm'
    ).addEventListener(
        'submit',
        async function (e) {

            e.preventDefault();


            const token =
                getJwt();


            if (!token) {

                alert("Sesión expirada.");

                window.location.href =
                    "/login";

                return;

            }


            const id =
                document.getElementById(
                    'estadisticaId'
                ).value;


            const partidoId =
                document.getElementById(
                    'partidoId'
                ).value;


            const jugadorId =
                document.getElementById(
                    'jugadorId'
                ).value;


            const minutos =
                document.getElementById(
                    'minutos'
                ).value;


            const goles =
                document.getElementById(
                    'goles'
                ).value;


            const asistencias =
                document.getElementById(
                    'asistencias'
                ).value;


            const rojas =
                document.getElementById(
                    'rojas'
                ).value;


            const amarillas =
                document.getElementById(
                    'amarillas'
                ).value;


            const titular =
                document.getElementById(
                    'titular'
                ).checked;


            const campeonatoId =
                document.getElementById(
                    'campeonatoId'
                ).value;


            if (!campeonatoId) {

                alert(
                    "Debés seleccionar un campeonato."
                );

                return;

            }


            if (!partidoId) {

                alert(
                    "Debés seleccionar un partido."
                );

                return;

            }


            if (!jugadorId) {

                alert(
                    "Debés seleccionar un jugador."
                );

                return;

            }


            const estadisticaData = {

                jugadorId:
                    Number(jugadorId),

                partidoId:
                    Number(partidoId),

                minutos:
                    Number(minutos),

                goles:
                    Number(goles),

                asistencias:
                    Number(asistencias),

                rojas:
                    Number(rojas),

                amarillas:
                    Number(amarillas),

                titular:
                    titular

            };


            console.log(
                "Enviando estadística:",
                estadisticaData
            );


            const boton =
                document.getElementById(
                    'submitButton'
                );


            boton.disabled =
                true;


            boton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';


            try {

                const url =
                    id
                        ? `/api/estadisticas/${id}`
                        : '/api/estadisticas';


                const method =
                    id
                        ? 'PUT'
                        : 'POST';


                console.log(
                    "Método:",
                    method
                );


                console.log(
                    "URL:",
                    url
                );


                const res =
                    await fetch(
                        url,
                        {

                            method:
                                method,

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            },

                            body:
                                JSON.stringify(
                                    estadisticaData
                                )

                        }
                    );


                if (!res.ok) {

                    let mensaje =
                        id
                            ? "No se pudo actualizar la estadística."
                            : "No se pudo crear la estadística.";


                    try {

                        const errorData =
                            await res.json();


                        if (
                            errorData.mensaje
                        ) {

                            mensaje =
                                errorData.mensaje;

                        } else if (
                            errorData.message
                        ) {

                            mensaje =
                                errorData.message;

                        }

                    } catch (_) {

                        try {

                            const texto =
                                await res.text();


                            if (texto) {

                                console.error(
                                    "Respuesta del servidor:",
                                    texto
                                );

                            }

                        } catch (_) {}

                    }


                    throw new Error(
                        mensaje
                    );

                }


                let savedEstadistica =
                    null;


                try {

                    savedEstadistica =
                        await res.json();


                } catch (_) {

                    console.log(
                        "La respuesta no contiene JSON."
                    );

                }


                console.log(
                    "Estadística guardada:",
                    savedEstadistica
                );


                alert(
                    id
                        ? "Estadística actualizada correctamente."
                        : "Estadística creada correctamente."
                );


                window.location.href =
                    "/estadisticas";


            } catch (error) {

                console.error(
                    "Error guardando estadística:",
                    error
                );


                alert(
                    error.message ||
                    "Error al guardar la estadística."
                );


                boton.disabled =
                    false;


                boton.innerHTML =
                    '<i class="fa-solid fa-floppy-disk mr-2"></i> ' +
                    (
                        id
                            ? "Actualizar estadística"
                            : "Guardar estadística"
                    );

            }

        }
    );

</script>

</div>

</body>

</html>
