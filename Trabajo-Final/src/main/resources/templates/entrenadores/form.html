<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(~{::#content})}"
      lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Entrenador</title>
    <!-- Evita el request de favicon -->
    <link rel="icon" href="data:,">
    <!-- Tailwind (solo para dev, en prod instalalo con npm) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
<div id="content" class="max-w-[1000px] mx-auto">

    <!-- HEADER -->
    <div class="flex items-center gap-4 mb-10">
        <a th:href="@{/entrenadores}" class="w-11 h-11 flex items-center justify-center
                  bg-[#0f172a] border border-slate-800 rounded-xl
                  text-slate-400 hover:text-emerald-500
                  hover:border-emerald-500/30 transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 id="formTitle" class="text-4xl font-black text-white italic uppercase tracking-tight">
                Nuevo Entrenador
            </h1>
            <p class="text-emerald-500 font-bold mt-1">
                Completá los datos del personal técnico.
            </p>
        </div>
    </div>

    <!-- FORMULARIO -->
    <form id="entrenadorForm">
        <input type="hidden" id="entrenadorId">

        <div class="bg-[#0f172a] border border-slate-800 rounded-[2.5rem] p-8">
            <!-- CAMPOS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="nombre" class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Nombre</label>
                    <input type="text" id="nombre" required
                           class="w-full bg-[#0a0f1d] border border-slate-800 text-slate-200 px-5 py-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                           placeholder="Ej: Juan">
                </div>
                <div class="space-y-2">
                    <label for="apellido" class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Apellido</label>
                    <input type="text" id="apellido" required
                           class="w-full bg-[#0a0f1d] border border-slate-800 text-slate-200 px-5 py-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                           placeholder="Ej: Pérez">
                </div>
                <div class="space-y-2 md:col-span-2">
                    <label for="edad" class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Edad</label>
                    <input type="number" id="edad" required min="18"
                           class="w-full bg-[#0a0f1d] border border-slate-800 text-slate-200 px-5 py-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                           placeholder="Ej: 35">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="flex justify-end gap-3 mt-8 pt-8 border-t border-slate-800">
                <a th:href="@{/entrenadores}" class="px-6 py-3 rounded-xl border border-slate-800 bg-[#0a0f1d] text-slate-400 hover:text-white font-bold transition-all">
                    Cancelar
                </a>
                <button type="submit" id="submitButton"
                        class="px-8 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black uppercase text-xs tracking-widest shadow-lg shadow-emerald-500/20 transition-all">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar entrenador
                </button>
            </div>
        </div>
    </form>

<script>
    function getJwt() {
        const cookie = document.cookie.split('; ').find(row => row.startsWith('token='));
        return cookie ? cookie.split('=')[1] : null;
    }

    async function cargarEntrenador(id) {
        const token = getJwt();
        try {
            const res = await fetch(`/api/entrenadores/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error("No se pudo obtener el entrenador.");
            const e = await res.json();
            document.getElementById('entrenadorId').value = e.id;
            document.getElementById('nombre').value = e.nombre;
            document.getElementById('apellido').value = e.apellido;
            document.getElementById('edad').value = e.edad;
            document.getElementById('formTitle').innerText = "Editar Entrenador";
            document.getElementById('submitButton').innerHTML = '<i class="fa-solid fa-pen mr-2"></i> Actualizar entrenador';
        } catch (error) {
            console.error("Error cargando:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) cargarEntrenador(id);
    });

    document.getElementById('entrenadorForm').onsubmit = async function(e) {
        e.preventDefault();

        const token = getJwt();
        if (!token) {
            alert("Sesión expirada.");
            window.location.href = "/login";
            return;
        }

        const id = document.getElementById('entrenadorId').value;
        const edad = parseInt(document.getElementById('edad').value);
        if (isNaN(edad)) {
            alert("Edad inválida");
            return;
        }

        const entrenadorData = {
            nombre: document.getElementById('nombre').value.trim(),
            apellido: document.getElementById('apellido').value.trim(),
            edad: edad
        };

        console.log("Enviando JSON:", entrenadorData);

        const boton = document.getElementById('submitButton');
        boton.disabled = true;
        boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';

        try {
            const url = id ? `/api/entrenadores/${id}` : '/api/entrenadores';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(entrenadorData)
            });

            if (res.ok) {
                alert("Guardado correctamente");
                window.location.href = "/entrenadores";
            } else {
                const errorText = await res.text();
                console.error("Error del servidor:", errorText);
                throw new Error("Error al guardar (status " + res.status + ")");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Error al guardar: " + error.message);
            boton.disabled = false;
            boton.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar entrenador';
        }
    };
</script>
</body>
</html>
