    <!-- ========================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================= -->

    <script>


        // =========================================================
        // OBTENER JWT
        // =========================================================

        function getJwt() {

            const cookie =
                document.cookie
                    .split('; ')
                    .find(row =>
                        row.startsWith('token=')
                    );

            return cookie
                ? cookie.substring(6)
                : null;
        }


        // =========================================================
        // CARGAR CATEGORÍAS
        // =========================================================

        async function cargarCategorias() {

            const select =
                document.getElementById('categoriaId');

            const token =
                getJwt();


            if (!token) {

                alert("Sesión expirada.");

                window.location.href =
                    "/login";

                return false;
            }


            try {

                const res =
                    await fetch(
                        '/api/categorias',
                        {

                            method: 'GET',

                            headers: {

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            }

                        }
                    );


                // =================================================
                // ERROR HTTP
                // =================================================

                if (!res.ok) {

                    if (
                        res.status === 401 ||
                        res.status === 403
                    ) {

                        throw new Error(
                            "No tenés permisos para consultar las categorías."
                        );
                    }


                    throw new Error(
                        "No se pudieron cargar las categorías."
                    );
                }


                const data =
                    await res.json();


                console.log(
                    "Respuesta /api/categorias:",
                    data
                );


                // =================================================
                // SOPORTAR ARRAY O PAGINACIÓN
                // =================================================

                let categorias = [];


                if (Array.isArray(data)) {

                    categorias = data;

                } else if (
                    data &&
                    Array.isArray(data.content)
                ) {

                    categorias =
                        data.content;

                } else if (
                    data &&
                    typeof data === 'object'
                ) {

                    categorias = [data];

                }


                // =================================================
                // LIMPIAR SELECT
                // =================================================

                select.innerHTML = `

                    <option value="">
                        Seleccione una categoría...
                    </option>

                `;


                // =================================================
                // SIN CATEGORÍAS
                // =================================================

                if (categorias.length === 0) {

                    select.innerHTML = `

                        <option value="">
                            No hay categorías registradas
                        </option>

                    `;

                    console.warn(
                        "No hay categorías registradas."
                    );

                    return false;
                }


                // =================================================
                // AGREGAR CATEGORÍAS
                // =================================================

                categorias.forEach(categoria => {

                    if (!categoria.id) {
                        return;
                    }


                    const option =
                        document.createElement('option');


                    option.value =
                        categoria.id;


                    option.textContent =
                        `${categoria.nombre || 'Sin nombre'}`
                        + (
                            categoria.año
                                ? ` - ${categoria.año}`
                                : ''
                        );


                    select.appendChild(option);

                });


                return true;


            } catch (error) {

                console.error(
                    "Error cargando categorías:",
                    error
                );


                alert(
                    error.message ||
                    "No se pudieron cargar las categorías."
                );


                return false;
            }
        }


        // =========================================================
        // CARGAR JUGADOR PARA EDITAR
        // =========================================================

        async function cargarDatosJugador(id) {

            const token =
                getJwt();


            if (!token) {

                alert("Sesión expirada.");

                window.location.href =
                    "/login";

                return;
            }


            try {

                const res =
                    await fetch(
                        `/api/jugadores/${id}`,
                        {

                            method: 'GET',

                            headers: {

                                'Authorization':
                                    'Bearer ' + token,

                                'Accept':
                                    'application/json'

                            }

                        }
                    );


                if (!res.ok) {

                    if (
                        res.status === 401 ||
                        res.status === 403
                    ) {

                        throw new Error(
                            "No tenés permisos para consultar el jugador."
                        );
                    }


                    throw new Error(
                        "No se pudo cargar el jugador."
                    );
                }


                const jugador =
                    await res.json();


                console.log(
                    "Jugador obtenido:",
                    jugador
                );


                // =================================================
                // DATOS PERSONALES
                // =================================================

                document.getElementById(
                    'jugadorId'
                ).value =
                    jugador.id || '';


                document.getElementById(
                    'nombre'
                ).value =
                    jugador.nombre || '';


                document.getElementById(
                    'apellido'
                ).value =
                    jugador.apellido || '';


                document.getElementById(
                    'dni'
                ).value =
                    jugador.dni || '';


                document.getElementById(
                    'fechaNacimiento'
                ).value =
                    jugador.fechaNacimiento || '';


                // =================================================
                // DATOS DEPORTIVOS
                // =================================================

                document.getElementById(
                    'posicion'
                ).value =
                    jugador.posicion || '';


                document.getElementById(
                    'numeroCamiseta'
                ).value =
                    jugador.numeroCamiseta ?? '';


                // =================================================
                // CATEGORÍA
                // =================================================

                let categoriaId =
                    jugador.categoriaId;


                /*
                 * Por si el backend devuelve
                 * el objeto categoría.
                 */

                if (
                    !categoriaId &&
                    jugador.categoria
                ) {

                    categoriaId =
                        jugador.categoria.id;

                }


                if (categoriaId) {

                    document.getElementById(
                        'categoriaId'
                    ).value =
                        String(categoriaId);

                }


                // =================================================
                // IMAGEN
                // =================================================

                if (jugador.imagenUrl) {

                    mostrarPreview(
                        jugador.imagenUrl
                    );

                }


                // =================================================
                // CAMBIAR INTERFAZ A EDICIÓN
                // =================================================

                document.getElementById(
                    'formTitle'
                ).innerText =
                    "Editar Jugador";


                document.getElementById(
                    'submitButton'
                ).innerHTML =
                    '<i class="fa-solid fa-pen-to-square mr-2"></i> Actualizar jugador';


            } catch (error) {

                console.error(
                    "Error cargando jugador:",
                    error
                );


                alert(
                    error.message ||
                    "No se pudo cargar el jugador."
                );

            }

        }


        // =========================================================
        // PREVIEW IMAGEN
        // =========================================================

        document.getElementById(
            'fotoInput'
        ).addEventListener(
            'change',
            function (e) {

                const file =
                    e.target.files[0];


                if (!file) {
                    return;
                }


                if (!file.type.startsWith('image/')) {

                    alert(
                        "Seleccioná una imagen válida."
                    );

                    this.value = '';

                    return;
                }


                mostrarPreview(
                    URL.createObjectURL(file)
                );

            }
        );


        // =========================================================
        // MOSTRAR PREVIEW
        // =========================================================

        function mostrarPreview(url) {

            const image =
                document.getElementById(
                    'imagePreview'
                );


            const placeholder =
                document.getElementById(
                    'imagePlaceholder'
                );


            image.src =
                url;


            image.classList.remove(
                'hidden'
            );


            placeholder.classList.add(
                'hidden'
            );

        }


        // =========================================================
        // INICIALIZAR
        // =========================================================

        document.addEventListener(
            'DOMContentLoaded',
            async function () {

                /*
                 * Primero cargamos las categorías.
                 * Esto es importante para que cuando
                 * carguemos un jugador en modo edición
                 * podamos seleccionar su categoría.
                 */

                const categoriasCargadas =
                    await cargarCategorias();


                /*
                 * Comprobamos si estamos editando.
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const id =
                    params.get('id');


                if (id) {

                    if (categoriasCargadas) {

                        await cargarDatosJugador(id);

                    } else {

                        alert(
                            "No se puede editar el jugador porque no se pudieron cargar las categorías."
                        );

                    }

                }

            }
        );


        // =========================================================
        // GUARDAR / ACTUALIZAR JUGADOR
        // =========================================================

        document.getElementById(
            'jugadorForm'
        ).addEventListener(
            'submit',
            async function (e) {

                e.preventDefault();


                const token =
                    getJwt();


                if (!token) {

                    alert("Sesión expirada.");

                    window.location.href =
                        "/login";

                    return;
                }


                // =================================================
                // DATOS
                // =================================================

                const id =
                    document.getElementById(
                        'jugadorId'
                    ).value;


                const nombre =
                    document.getElementById(
                        'nombre'
                    ).value.trim();


                const apellido =
                    document.getElementById(
                        'apellido'
                    ).value.trim();


                const dni =
                    document.getElementById(
                        'dni'
                    ).value.trim();


                const fechaNacimiento =
                    document.getElementById(
                        'fechaNacimiento'
                    ).value;


                const posicion =
                    document.getElementById(
                        'posicion'
                    ).value.trim();


                const numeroCamiseta =
                    document.getElementById(
                        'numeroCamiseta'
                    ).value;


                const categoriaId =
                    document.getElementById(
                        'categoriaId'
                    ).value;


                // =================================================
                // VALIDACIONES
                // =================================================

                if (!nombre) {

                    alert(
                        "El nombre es obligatorio."
                    );

                    return;
                }


                if (!apellido) {

                    alert(
                        "El apellido es obligatorio."
                    );

                    return;
                }


                if (!dni) {

                    alert(
                        "El DNI es obligatorio."
                    );

                    return;
                }


                if (!fechaNacimiento) {

                    alert(
                        "La fecha de nacimiento es obligatoria."
                    );

                    return;
                }


                if (!posicion) {

                    alert(
                        "La posición es obligatoria."
                    );

                    return;
                }


                if (!numeroCamiseta) {

                    alert(
                        "El número de camiseta es obligatorio."
                    );

                    return;
                }


                if (!categoriaId) {

                    alert(
                        "Debés seleccionar una categoría."
                    );

                    return;
                }


                // =================================================
                // OBJETO
                // =================================================

                const jugadorData = {

                    nombre: nombre,

                    apellido: apellido,

                    dni: dni,

                    fechaNacimiento:
                        fechaNacimiento,

                    posicion: posicion,

                    numeroCamiseta:
                        Number(numeroCamiseta),

                    categoriaId:
                        Number(categoriaId)

                };


                console.log(
                    "Enviando jugador:",
                    jugadorData
                );


                // =================================================
                // BOTÓN
                // =================================================

                const boton =
                    document.getElementById(
                        'submitButton'
                    );


                boton.disabled =
                    true;


                boton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';


                try {

                    // =================================================
                    // GUARDAR JUGADOR
                    // =================================================

                    const url =
                        id
                            ? `/api/jugadores/${id}`
                            : '/api/jugadores';


                    const method =
                        id
                            ? 'PUT'
                            : 'POST';


                    const res =
                        await fetch(
                            url,
                            {

                                method: method,

                                headers: {

                                    'Content-Type':
                                        'application/json',

                                    'Authorization':
                                        'Bearer ' + token,

                                    'Accept':
                                        'application/json'

                                },

                                body:
                                    JSON.stringify(
                                        jugadorData
                                    )

                            }
                        );


                    // =================================================
                    // ERROR
                    // =================================================

                    if (!res.ok) {

                        let mensaje =
                            "No se pudo guardar el jugador.";


                        try {

                            const errorData =
                                await res.json();


                            if (
                                errorData.mensaje
                            ) {

                                mensaje =
                                    errorData.mensaje;

                            } else if (
                                errorData.message
                            ) {

                                mensaje =
                                    errorData.message;
                            }


                        } catch (_) {

                            const texto =
                                await res.text();


                            if (texto) {

                                console.error(
                                    "Respuesta del servidor:",
                                    texto
                                );

                            }

                        }


                        throw new Error(
                            mensaje
                        );

                    }


                    // =================================================
                    // RESPUESTA
                    // =================================================

                    const savedJugador =
                        await res.json();


                    console.log(
                        "Jugador guardado:",
                        savedJugador
                    );


                    // =================================================
                    // SUBIR IMAGEN
                    // =================================================

                    const fotoFile =
                        document.getElementById(
                            'fotoInput'
                        ).files[0];


                    if (fotoFile) {

                        const formData =
                            new FormData();


                        formData.append(
                            'imagen',
                            fotoFile
                        );


                        const imagenRes =
                            await fetch(
                                `/api/jugadores/${savedJugador.id}/imagen`,
                                {

                                    method: 'POST',

                                    headers: {

                                        'Authorization':
                                            'Bearer ' + token

                                    },

                                    body:
                                        formData

                                }
                            );


                        if (!imagenRes.ok) {

                            throw new Error(
                                "El jugador se guardó, pero no se pudo subir la imagen."
                            );

                        }

                    }


                    // =================================================
                    // ÉXITO
                    // =================================================

                    alert(
                        id
                            ? "Jugador actualizado correctamente."
                            : "Jugador creado correctamente."
                    );


                    window.location.href =
                        "/jugadores";


                } catch (error) {

                    console.error(
                        "Error guardando jugador:",
                        error
                    );


                    alert(
                        error.message ||
                        "Error al guardar el jugador."
                    );


                    boton.disabled =
                        false;


                    boton.innerHTML =
                        '<i class="fa-solid fa-floppy-disk mr-2"></i> ' +
                        (
                            id
                                ? "Actualizar jugador"
                                : "Guardar jugador"
                        );

                }

            }
        );

    </script>

</div>

</body>

</html>
